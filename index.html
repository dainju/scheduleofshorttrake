/* =========================

function showScreen(
screenId,
saveHistory=true
){

document
.querySelectorAll(".screen")
.forEach(screen=>{

screen.classList.remove(
"active"
);

});

const target =
document.getElementById(
screenId
);

if(target){

target.classList.add(
"active"
);

currentScreen =
screenId;

}

if(saveHistory){

history.pushState(
{
screen:screenId
},
"",
"#"+screenId
);

}

closeMenu();

}

window.addEventListener(
"popstate",
event=>{

if(
event.state &&
event.state.screen
){

showScreen(
event.state.screen,
false
);

}

}
);

history.replaceState(
{
screen:"scheduleScreen"
},
"",

/* =========================
DATE
========================= */

function parseDate(str){

if(!str) return null;

const p =
str.split(".");

if(p.length !== 3)
return null;

return new Date(
Number(p[0]),
Number(p[1])-1,
Number(p[2])
);

}

function formatRange(
start,
end
){

if(
!end ||
start===end
){
return start;
}

return `${start} ~ ${end}`;

}

function getDday(item){

const start =
parseDate(
item.start
);

if(!start)
return "";

const today =
new Date();

today.setHours(
0,0,0,0
);

const diff =
Math.ceil(
(start-today)
/ 86400000
);

if(diff > 0){
return `D-${diff}`;
}

if(diff === 0){
return "D-DAY";
}

return "";
}

/* =========================
CSV
========================= */

function parseCSVLine(line){

const result = [];

let current = "";
let quote = false;

for(
let i=0;
i<line.length;
i++
){

const char =
line[i];

if(char === '"'){

quote = !quote;
continue;

}

if(
char === "," &&
!quote
){

result.push(current);

current = "";

continue;

}

current += char;

}

result.push(current);

return result;

}

/* =========================
카드 생성
========================= */

function createCompetitionCard(
item,
index,
past=false
){

let rightArea = "";

if(past){

if(item.category==="생활체육"){

rightArea =
'<span class="sports-badge">생활체육</span>';

}

}else{

const dday =
getDday(item);

if(dday){

rightArea =
`<span class="dday">${dday}</span>`;

}

}

return `

<div
class="card"
onclick="openCompetitionDetail(${index})">

<div class="card-top">

<div>
${formatRange(
item.start,
item.end
)}
</div>

<div>
${rightArea}
</div>

</div>

<div class="card-title">
${item.title}
</div>

<div class="card-place">
${item.place || ""}
</div>

</div>

`;

}

/* =========================
검색
========================= */

function getFilteredCompetitions(){

const keyword =
document
.getElementById("search")
.value
.trim()
.toLowerCase();

let list =
[...competitions];

if(keyword){

list = list.filter(item=>{

return (
(item.title || "")
.toLowerCase()
.includes(keyword)

||

(item.place || "")
.toLowerCase()
.includes(keyword)

);

});

}

return list;

}

/* =========================
전체일정
가까운 대회순
========================= */

function renderSchedule(){

let list =
getFilteredCompetitions();

const today =
new Date();

today.setHours(
0,0,0,0
);

list = list
.filter(item=>{

const date =
parseDate(item.start);

return date && date >= today;

})
.sort((a,b)=>{

return parseDate(a.start)
-
parseDate(b.start);

});

document
.getElementById(
"scheduleScreen"
)
.innerHTML =

list.map(item=>

createCompetitionCard(
item,
competitions.indexOf(item)
)

).join("");

}

/* =========================
이번달 경기
========================= */

function renderMonth(){

const year =
currentDate.getFullYear();

const month =
currentDate.getMonth();

let list =
competitions.filter(item=>{

const date =
parseDate(item.start);

if(!date)
return false;

return (
date.getFullYear()===year &&
date.getMonth()===month
);

});

list.sort((a,b)=>{

return parseDate(a.start)
-
parseDate(b.start);

});

document
.getElementById(
"monthScreen"
)
.innerHTML =

list.map(item=>

createCompetitionCard(
item,
competitions.indexOf(item)
)

).join("");

}

/* =========================
국내대회
========================= */

function renderDomestic(){

let list =
competitions.filter(item=>{

return item.type === "국내";

});

list.sort((a,b)=>{

return parseDate(a.start)
-
parseDate(b.start);

});

document
.getElementById(
"domesticScreen"
)
.innerHTML =

list.map(item=>

createCompetitionCard(
item,
competitions.indexOf(item)
)

).join("");

...new Set(

competitions

/* =========================
시즌 열기
========================= */

function openSeason(season){

showScreen(
"seasonScreen"
);

let seasonList =

competitions.filter(item=>

item.season === season

);

seasonList.sort((a,b)=>{

return parseDate(a.start)
-
parseDate(b.start);

});

let html = `

<div class="page-title">

${season} 시즌

</div>

`;

seasonList.forEach(item=>{

html += createCompetitionCard(
item,
competitions.indexOf(item),
true
);

});

if(
seasonList.length===0
){

html += `

<div class="list-item">
등록된 대회가 없습니다.
</div>

`;

}

document
.getElementById(
"seasonScreen"
)
.innerHTML = html;

}

/* =========================
남자 결과 찾기
========================= */

function findMenResult(item){

return menResults.find(result=>

result.season === item.season &&

result.title === item.title

);

}

/* =========================
여자 결과 찾기
========================= */

function findWomenResult(item){

return womenResults.find(result=>

result.season === item.season &&

result.title === item.title

);

}

.getElementById(
"detailModal"

!result[key]

html += `

<div class="info-row">

<b>${key}</b><br>

${result[key]}

</div>

`;

});

document
.getElementById(
"modalBody"
)

function openTeamPlayers(
group,
team
){

showScreen(
"playerListScreen"
);

let playerList = [];

/* 실업팀 */

if(
group==="business"
){

playerList =
players.business[team]
|| [];

}

/* 대학부 */

if(
group==="university"
){

playerList =
players.university[team]
|| [];

}

/* 고등부 */

if(
group==="high"
){

playerList =
team==="남고부"
? players.highMale
: players.highFemale;

}

/* 중등부 */

if(
group==="middle"
){

playerList =
team==="남중부"
? players.middleMale
: players.middleFemale;

}

/* 초등부 */

if(
group==="elementary"
){

playerList =
team==="남초부"
? players.elementaryMale
: players.elementaryFemale;

}

document
.getElementById(
"playerListScreen"
)
.innerHTML = `

<div class="page-title">

${team}

</div>

${playerList.length

? playerList.map(player=>`

<div class="list-item">

${player}

</div>

`).join("")

: `

<div class="list-item">

등록된 선수가 없습니다.

</div>

`

}

`;

}

async function loadPlayers(){

try{

const response =
await fetch(
PLAYER_URL
);

const text =
await response.text();

const rows =
text.trim().split("\n");

/* 헤더 제거 */

rows.shift();

players = {

maleNational:[],

femaleNational:[],

business:{
"강원도청":[],
"고양시청":[],
"서울시청":[],
"성남시청":[],
"스포츠토토":[],
"전북도청":[],
"화성시청":[]
},

university:{
"경희대":[],
"고려대":[],
"국민대":[],
"단국대":[],
"동의대":[],
"디지털서울문화예술대":[],
"서울디지털대":[],
"용인대":[],
"한국체대":[],
"한양대":[]
},

highMale:[],
highFemale:[],

middleMale:[],
middleFemale:[],

elementaryMale:[],
elementaryFemale:[]

};

rows.forEach(row=>{

const c =
parseCSVLine(row);

/* 국가대표 */

if(c[0])
players.maleNational.push(c[0]);

if(c[1])
players.femaleNational.push(c[1]);

/* 실업팀 */

players.business["고양시청"].push(c[3]);

if(c[4])
players.business["서울시청"].push(c[4]);

if(c[5])
players.business["성남시청"].push(c[5]);

if(c[6])
players.business["스포츠토토"].push(c[6]);

if(c[7])
players.business["전북도청"].push(c[7]);

if(c[8])
players.business["화성시청"].push(c[8]);

/* 대학부 */

if(c[9])
players.university["경희대"].push(c[9]);

if(c[10])
players.university["고려대"].push(c[10]);

if(c[11])
players.university["국민대"].push(c[11]);

if(c[12])
players.university["단국대"].push(c[12]);

if(c[13])
players.university["동의대"].push(c[13]);

if(c[14])
players.university["디지털서울문화예술대"].push(c[14]);

if(c[15])
players.university["서울디지털대"].push(c[15]);

if(c[16])
players.university["용인대"].push(c[16]);

if(c[17])
players.university["한국체대"].push(c[17]);

if(c[18])
players.university["한양대"].push(c[18]);

/* 고등부 */

if(c[19])
players.highMale.push(c[19]);

if(c[20])
players.highFemale.push(c[20]);

/* 중등부 */

if(c[21])
players.middleMale.push(c[21]);

if(c[22])
players.middleFemale.push(c[22]);

/* 초등부 */

if(c[23])
players.elementaryMale.push(c[23]);

if(c[24])

});

}catch(error){

let currentScreen =
"scheduleScreen";

function showScreen(
screenId,
saveHistory=true
){

document
.querySelectorAll(
".screen"
)
.forEach(screen=>{

screen.classList.remove(
"active"
);

});

const target =
document.getElementById(
screenId
);

if(target){

target.classList.add(
"active"
);

currentScreen =
screenId;

}

if(saveHistory){

history.pushState(
{
screen:screenId
},
"",
"#"+screenId
);

}

closeMenu();

}

function createCompetitionCard(
item,
index,
showDday=true,
showSports=false
){

return `

<div
class="card"
onclick="openCompetitionDetail(${index})">

<div class="card-top">

<div>

${formatRange(
item.start,
item.end
)}

</div>

<div>

${
showDday
? `<span class="dday">${getDday(item)}</span>`
: (
showSports &&
item.category==="생활체육"
? `<span class="sports-badge">생활체육</span>`
: ""
)
}

</div>

</div>

<div class="card-title">

${item.title}

</div>

<div class="card-place">

${item.place || "-"}

</div>

</div>

`;

}

/* =========================
탭 렌더링
========================= */

function renderTabs(){

const keyword =
document
.getElementById(
"search"
)
.value
.toLowerCase()
.trim();

const today =
new Date();

today.setHours(
0,0,0,0
);

/* 검색 */

let filtered =
competitions.filter(item=>{

const text =

(item.title || "") +
(item.place || "");

return text
.toLowerCase()
.includes(keyword);

});

/* =====================
전체일정
===================== */

const upcoming =

filtered

.filter(item=>{

const start =
parseDate(
item.start
);

return (
start &&
start >= today
);

})

.sort((a,b)=>{

return (
parseDate(a.start)
-
parseDate(b.start)
);

});

document
.getElementById(
"scheduleScreen"
)
.innerHTML =

upcoming
.map(item=>

createCompetitionCard(
item,
competitions.indexOf(item),
true,
false
)

)
.join("");

/* =====================
이번달 경기
===================== */

const currentYear =
today.getFullYear();

const currentMonth =
today.getMonth();

const monthGames =

upcoming.filter(item=>{

const start =
parseDate(
item.start
);

if(!start)
return false;

return (

start.getFullYear()
=== currentYear &&

start.getMonth()
=== currentMonth

);

});

document
.getElementById(
"monthScreen"
)
.innerHTML =

monthGames.length

? monthGames
.map(item=>

createCompetitionCard(
item,
competitions.indexOf(item),
true,
false
)

)
.join("")

: `

<div class="list-item">

이번달 경기가 없습니다.

</div>

`;

/* =====================
국내대회
===================== */

const domestic =

upcoming.filter(item=>

(item.type || "")
.includes("국내")

);

document
.getElementById(
"domesticScreen"
)
.innerHTML =

domestic.length

? domestic
.map(item=>

createCompetitionCard(
item,
competitions.indexOf(item),
true,
false
)

)
.join("")

: `

<div class="list-item">

국내대회가 없습니다.

</div>

`;

/* =====================
국제대회
===================== */

const international =

upcoming.filter(item=>

(item.type || "")
.includes("국제")

);

document
.getElementById(
"internationalScreen"
)
.innerHTML =

international.length

? international
.map(item=>

createCompetitionCard(
item,
competitions.indexOf(item),
true,
false
)

)
.join("")

: `

<div class="list-item">

국제대회가 없습니다.

</div>

`;

/* =====================
종료대회 화면은
시즌 클릭 후 렌더링
===================== */

}

);

달력 이동
========================= */

document.addEventListener(
"click",
function(e){

if(
e.target.id==="prevMonth"
){

currentDate.setMonth(
currentDate.getMonth()-1
);

renderCalendar();

}

if(
e.target.id==="nextMonth"
){

currentDate.setMonth(
currentDate.getMonth()+1
);

renderCalendar();

}

}
);

모달 닫기
========================= */

window.addEventListener(
"click",
function(e){

const modal =
document.getElementById(
"detailModal"
);

if(
e.target===modal
){

closeModal();

}

}
);

/* =========================
안드로이드 뒤로가기 지원
========================= */

history.replaceState(
{
screen:"scheduleScreen"
},
"",
"#scheduleScreen"
);

window.addEventListener(
"popstate",
function(e){

if(
e.state &&
e.state.screen
){

showScreen(
e.state.screen,
false
);

}

}
);

/* =========================
시작
========================= */

initializeApp();

/* =========================
END
========================= */
