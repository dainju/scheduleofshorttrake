
<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shortchedule</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#F5F7F7;
color:#222;

:root{

/* =========================
HEADER
========================= */

position:fixed;
top:0;
left:0;
right:0;
height:60px;
background:var(--main);
display:flex;
align-items:center;
padding:0 16px;

color:white;

}

/* =========================
SIDEBAR
========================= */

.sidebar{

top:0;
left:-320px;
width:300px;
height:100%;
background:white;
overflow-y:auto;
transition:.3s;
box-shadow:2px 0 15px rgba(0,0,0,.15);
z-index:3500;

.sidebar.open{

}

.menu-item{

cursor:pointer;
border-bottom:1px solid #eee;
font-size:16px;
}

/* =========================
OVERLAY
========================= */

position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.3);

}

}

CONTENT

========================= */

padding:14px;
border:none;
border-radius:14px;
margin-bottom:18px;
font-size:15px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

/* =========================
SCREEN
========================= */

.screen{
display:none;
}

.screen.active{

}

/* =========================
TITLE
========================= */

.page-title{
font-size:24px;
font-weight:bold;
margin-bottom:20px;
}

/* =========================
CARD
========================= */

.card{
background:white;
border-radius:16px;
padding:16px;
margin-bottom:12px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
cursor:pointer;
}

.card-top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
font-size:14px;
color:#666;
}

.card-title{
font-size:20px;
font-weight:bold;
line-height:1.4;
margin-bottom:10px;

-webkit-line-clamp:2;
-webkit-box-orient:vertical;
overflow:hidden;
}

.card-place{

}

.dday{
background:var(--main);
color:white;
padding:4px 10px;
border-radius:999px;
font-size:12px;
font-weight:bold;
}

.sports-badge{
background:#EEF5F5;
padding:4px 10px;
border-radius:999px;
font-size:12px;
font-weight:bold;
}

/* =========================
LIST
========================= */

.list-item{
background:white;
padding:16px;
border-radius:14px;
margin-bottom:10px;
cursor:pointer;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

/* =========================
CALENDAR
========================= */

.calendar-nav{
display:flex;
justify-content:center;
align-items:center;
gap:15px;
margin-bottom:15px;
}

.calendar-nav button{
border:none;
background:var(--main);
color:white;
padding:8px 14px;
border-radius:8px;
cursor:pointer;
}

.calendar-grid{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:1px;
background:#ddd;
}

.day-header{
background:var(--main);
color:white;
padding:10px;
text-align:center;
font-weight:bold;
}

.day{
background:white;
min-height:90px;
padding:4px;
overflow:hidden;
}

.day-number{
font-weight:bold;
margin-bottom:4px;
}

.event{
background:#EEF5F5;
padding:3px;
margin-top:3px;
border-radius:5px;
font-size:10px;

overflow:hidden;
white-space:nowrap;
text-overflow:ellipsis;

/* =========================
MODAL
========================= */

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.55);
justify-content:center;
align-items:center;

z-index:5000;

.modal-content{

.result-btn{

</style>

<script>

/* =========================
CSV
========================= */

const SCHEDULE_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTRV-lLroEFMXiMaricD-GkYcWOyt8cwT6Z6f49GlqbJVwXMQdJllhzPc_gg8io9x6B-z0o_tk3Xbdl/pub?gid=1082967064&single=true&output=csv";

const PLAYER_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTyGAUBesyUjGuuAHSsJB0pVgTzPsW_D6H0i1U8mdflyI4zFPzmlwWYrMuXBIjSblX0c-7mVoFX3AW7/pub?gid=0&single=true&output=csv";

const MEN_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTswd4uMhCYfp76AGceaAt69FcRoVuQz8Jn-wtK-U24kXdNQyPqFJWP7dJnGm8gw-rFPw7CgmcDaizf/pub?gid=0&single=true&output=csv";

const WOMEN_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSmgJa6tVpjryj2UjpAiUQqeiXSQC2e2kZaT8UDyJCkhYwp4dtEgofnNEZnJX3alL_XTh3tO0m2XzeP/pub?gid=0&single=true&output=csv";

/* =========================
GLOBAL
========================= */

let competitions = [];
let players = {};
let menResults = [];
let womenResults = [];

let currentScreen =
"scheduleScreen";

let currentDate =
new Date();

/* ===== PART 1 END ===== */
/* =========================
MENU
========================= */

function renderMenu(){

document.getElementById(
"menuArea"
).innerHTML = `

<div class="menu-item"
onclick="openSchedule()">
전체일정
</div>

<div class="menu-item"
onclick="openMonth()">
이번달경기
</div>

<div class="menu-item"
onclick="openDomestic()">
국내대회
</div>

<div class="menu-item"
onclick="openInternational()">
국제대회
</div>

<div class="menu-item"
onclick="openPastMenu()">
종료대회
</div>

<div class="menu-item"
onclick="openCalendar()">
달력
</div>

<div class="menu-item"
onclick="openPlayers()">

</div>

}

/* =========================
MENU CONTROL
========================= */

function toggleMenu(){

document
.getElementById("sidebar")
.classList
.toggle("open");

document
.getElementById("overlay")
.classList
.toggle("show");

}

function closeMenu(){

document
.getElementById("sidebar")
.classList
.remove("open");

document
.getElementById("overlay")
.classList
.remove("show");

}

/* =========================
SCREEN
========================= */

function showScreen(
screenId,
saveHistory=true
){

document
.querySelectorAll(".screen")
.forEach(screen=>{

screen.classList.remove(
"active"
);

});

const target =
document.getElementById(
screenId
);

if(target){

target.classList.add(
"active"
);

currentScreen =
screenId;

}

if(saveHistory){

history.pushState(
{
screen:screenId
},
"",
"#"+screenId
);

}

closeMenu();

}

/* =========================
ANDROID BACK
========================= */

window.addEventListener(
"popstate",
function(event){

if(
event.state &&
event.state.screen
){

showScreen(
event.state.screen,
false
);

}

}
);

history.replaceState(
{
screen:"scheduleScreen"
},
"",
"#scheduleScreen"
);

/* =========================
OPEN SCREEN
========================= */

function openSchedule(){

showScreen(
"scheduleScreen"
);

}

function openMonth(){

showScreen(
"monthScreen"
);

renderMonthScreen();

}

function openDomestic(){

showScreen(
"domesticScreen"
);

renderDomesticScreen();

}

function openInternational(){

showScreen(
"internationalScreen"
);

renderInternationalScreen();

}

function openCalendar(){

showScreen(
"calendarScreen"
);

renderCalendar();

}

/* =========================
DATE
========================= */

function parseDate(str){

if(!str)
return null;

const p =
str.trim().split(".");

if(
p.length !== 3
){
return null;
}

return new Date(
Number(p[0]),
Number(p[1])-1,
Number(p[2])
);

}

function formatDateRange(
start,
end
){

if(
!end ||
start===end
){
return start;
}

return `${start} ~ ${end}`;

}

function getDday(item){

const start =
parseDate(
item.start
);

if(!start)
return "";

const today =
new Date();

today.setHours(
0,0,0,0
);

const diff =
Math.ceil(
(start-today)
/
86400000
);

if(diff>0){

return `D-${diff}`;

}

if(diff===0){

return "D-DAY";

}

return "";

}

/* =========================
CSV PARSER
========================= */

function parseCSVLine(line){

const result = [];

let current = "";

let insideQuotes =
false;

for(
let i=0;
i<line.length;
i++
){

const char =
line[i];

if(char === '"'){

insideQuotes =
!insideQuotes;

continue;

}

if(
char === "," &&
!insideQuotes
){

result.push(
current
);

current="";

continue;

}

current += char;

}

result.push(
current
);

return result;

}

/* =========================
LOAD SCHEDULE
========================= */

async function loadCompetitions(){

const response =
await fetch(
SCHEDULE_URL
);

const text =
await response.text();

const rows =
text.trim().split("\n");

rows.shift();

competitions = [];

rows.forEach(row=>{

const c =
parseCSVLine(row);

competitions.push({

start:c[0] || "",
end:c[1] || "",
title:c[2] || "",
place:c[3] || "",
type:c[4] || "",
target:c[5] || "",
category:c[6] || "",
note:c[7] || "",
season:c[8] || ""

});

});

/* 가까운 대회순 */

competitions.sort(
(a,b)=>

parseDate(a.start)
-
parseDate(b.start)

);

}

/* =========================
CARD
========================= */

function createCard(
item,
index
){

return `

<div
class="card"
onclick="openCompetitionDetail(${index})">

<div class="card-top">

<div>

${formatDateRange(
item.start,
item.end
)}

</div>

<div class="dday">

${getDday(item)}

</div>

</div>

<div class="card-title">

${item.title}

</div>

<div class="card-place">

${item.place || ""}

</div>

</div>

`;

}

/* =========================
RENDER MAIN
========================= */

function renderSchedule(){

let keyword =
document
.getElementById(
"search"
)
.value
.toLowerCase();

const list =
competitions.filter(item=>

item.title
.toLowerCase()
.includes(keyword)

||

item.place
.toLowerCase()
.includes(keyword)

);

document
.getElementById(
"scheduleScreen"
)
.innerHTML =

list.map((item)=>{

const realIndex =
competitions.indexOf(item);

return createCard(
item,
realIndex
);

}).join("");

}

/* =========================
SEARCH
========================= */

document
.getElementById(
"search"
)
.addEventListener(
"input",
renderSchedule
);

/* ===== PART 2 END ===== */
/* =========================
DETAIL MODAL
========================= */

function openCompetitionDetail(index){

const item =
competitions[index];

document
.getElementById(
"modalBody"
)
.innerHTML = `

<div class="modal-title">

${item.title}

</div>

<div class="info-row">
<b>일정</b><br>
${formatDateRange(
item.start,
item.end
)}
</div>

<div class="info-row">
<b>장소</b><br>
${item.place || "-"}
</div>

<div class="info-row">
<b>구분</b><br>
${item.type || "-"}
</div>

<div class="info-row">
<b>참가대상</b><br>
${item.target || "-"}
</div>

<div class="info-row">
<b>비고</b><br>
${item.note || "-"}
</div>

<button
class="result-btn"
onclick="showMenResult('${item.title}','${item.season}')">

남자 경기결과

</button>

<button
class="result-btn"
onclick="showWomenResult('${item.title}','${item.season}')">

여자 경기결과

</button>

`;

document
.getElementById(
"detailModal"
)
.style.display =
"flex";

}

function closeModal(){

document
.getElementById(
"detailModal"
)
.style.display =
"none";

}

window.addEventListener(
"click",
function(e){

const modal =
document.getElementById(
"detailModal"
);

if(
e.target === modal
){

closeModal();

}

}
);

/* =========================
PAST MENU
========================= */

function openPastMenu(){

showScreen(
"pastScreen"
);

const seasons =

[
...new Set(

competitions
.map(item=>item.season)
.filter(Boolean)

)
]

.sort()
.reverse();

document
.getElementById(
"pastScreen"
)
.innerHTML = `

<div class="page-title">

종료대회

</div>

${seasons.map(season=>`

<div
class="list-item"
onclick="openSeason('${season}')">

${season} 시즌

</div>

`).join("")}

`;

}

/* =========================
SEASON PAGE
========================= */

function openSeason(season){

showScreen(
"seasonScreen"
);

const seasonList =

competitions.filter(item=>

item.season === season

);

let html = `

<div class="page-title">

${season} 시즌

</div>

`;

seasonList.forEach(item=>{

const index =
competitions.indexOf(item);

html += `

<div
class="card"
onclick="openCompetitionDetail(${index})">

<div class="card-top">

<div>

${formatDateRange(
item.start,
item.end
)}

</div>

${
item.category==="생활체육"
?
'<div class="sports-badge">생활체육</div>'
:
''
}

</div>

<div class="card-title">

${item.title}

</div>

<div class="card-place">

${item.place}

</div>

</div>

`;

});

document
.getElementById(
"seasonScreen"
)
.innerHTML =
html;

}

/* =========================
MONTH SCREEN
========================= */

function renderMonthScreen(){

const now =
new Date();

const y =
now.getFullYear();

const m =
now.getMonth();

const list =

competitions.filter(item=>{

const d =
parseDate(item.start);

if(!d) return false;

return (
d.getFullYear()===y &&
d.getMonth()===m
);

});

document
.getElementById(
"monthScreen"
)
.innerHTML =

list.map(item=>{

const index =
competitions.indexOf(item);

return createCard(
item,
index
);

}).join("");

}

/* =========================
DOMESTIC
========================= */

function renderDomesticScreen(){

const list =

competitions.filter(item=>

item.type.includes("국내")

);

document
.getElementById(
"domesticScreen"
)
.innerHTML =

list.map(item=>{

const index =
competitions.indexOf(item);

return createCard(
item,
index
);

}).join("");

}

/* =========================
INTERNATIONAL
========================= */

function renderInternationalScreen(){

const list =

competitions.filter(item=>

item.type.includes("국제")

);

document
.getElementById(
"internationalScreen"
)
.innerHTML =

list.map(item=>{

const index =
competitions.indexOf(item);

return createCard(
item,
index
);

}).join("");

}

/* =========================
MEN RESULT
========================= */

function showMenResult(
title,
season
){

const result =

menResults.find(item=>

item.title===title &&
item.season===season

);

if(!result){

alert(
"등록된 경기결과가 없습니다."
);

return;

}

let html = `
<div class="modal-title">
남자 경기결과
</div>
`;

Object.keys(result)
.forEach(key=>{

if(
key==="title" ||
key==="season"
){
return;
}

if(!result[key])
return;

html += `
<div class="info-row">
<b>${key}</b><br>
${result[key]}
</div>
`;

});

document
.getElementById(
"modalBody"
)
.innerHTML =
html;

}

/* =========================
WOMEN RESULT
========================= */

function showWomenResult(
title,
season
){

const result =

womenResults.find(item=>

item.title===title &&
item.season===season

);

alert(
"등록된 경기결과가 없습니다."
);

return;

}

let html = `
<div class="modal-title">
여자 경기결과
</div>
`;

Object.keys(result)
.forEach(key=>{

if(
key==="title" ||
key==="season"
){
return;
}

if(!result[key])
return;

html += `
<div class="info-row">
<b>${key}</b><br>
${result[key]}
</div>
`;

});

document
.getElementById(
"modalBody"
)
.innerHTML =
html;

}

/* ===== PART 3 END ===== */
/* =========================
LOAD PLAYERS
========================= */

async function loadPlayers(){

const response =
await fetch(
PLAYER_URL
);

const text =
await response.text();

const rows =
text.trim().split("\n");

rows.shift();

players = {

maleNational:[],
femaleNational:[],

business:{
"강원도청":[],
"고양시청":[],
"서울시청":[],
"성남시청":[],
"스포츠토토":[],
"전북도청":[],
"화성시청":[]
},

university:{
"경희대":[],
"고려대":[],
"국민대":[],
"단국대":[],
"동의대":[],
"디지털서울문화예술대":[],

"용인대":[],
"한국체대":[],

},

highMale:[],
highFemale:[],

middleMale:[],
middleFemale:[],

};

rows.forEach(row=>{

const c =
parseCSVLine(row);

/* 국가대표 */

if(c[0])
players.maleNational.push(c[0]);

if(c[1])
players.femaleNational.push(c[1]);

/* 실업팀 */

if(c[2])
players.business["강원도청"].push(c[2]);

if(c[3])
players.business["고양시청"].push(c[3]);

if(c[4])
players.business["서울시청"].push(c[4]);

if(c[5])
players.business["성남시청"].push(c[5]);

if(c[6])
players.business["스포츠토토"].push(c[6]);

if(c[7])
players.business["전북도청"].push(c[7]);

if(c[8])
players.business["화성시청"].push(c[8]);

/* 대학부 */

if(c[9])
players.university["경희대"].push(c[9]);

if(c[10])
players.university["고려대"].push(c[10]);

if(c[11])
players.university["국민대"].push(c[11]);

if(c[12])
players.university["단국대"].push(c[12]);

if(c[13])
players.university["동의대"].push(c[13]);

if(c[14])
players.university["디지털서울문화예술대"].push(c[14]);

if(c[15])
players.university["서울디지털대"].push(c[15]);

if(c[16])
players.university["용인대"].push(c[16]);

if(c[17])

});

data[1] || "";

result.title =
data[2] || "";

menResults.push(
result
);

});

}

/* =========================
CALENDAR
========================= */

function renderCalendar(){

const year =
currentDate.getFullYear();

const month =
currentDate.getMonth();

const firstDay =
new Date(
year,
month,
1
);

const lastDay =
new Date(
year,
month+1,
0
);

let html = `

<div class="calendar-nav">

<button onclick="prevMonth()">

◀

</button>

<h2>

${year}.${String(month+1).padStart(2,"0")}

</h2>

<button onclick="nextMonth()">

▶

</button>

</div>

<div class="calendar-grid">

<div class="day-header">일</div>
<div class="day-header">월</div>
<div class="day-header">화</div>
<div class="day-header">수</div>
<div class="day-header">목</div>
<div class="day-header">금</div>
<div class="day-header">토</div>

`;

for(
let i=0;
i<firstDay.getDay();
i++
){

html += `
<div class="day"></div>
`;

}

for(
let day=1;
day<=lastDay.getDate();
day++
){

const current =
new Date(
year,
month,
day
);

html += `

<div class="day">

<div class="day-number">

${day}

</div>

`;

competitions.forEach(item=>{

const start =
parseDate(
item.start
);

if(!start)
return;

if(

start.getFullYear()
=== current.getFullYear()

&&

start.getMonth()
=== current.getMonth()

&&

start.getDate()
=== current.getDate()

){

const index =
competitions.indexOf(item);

html += `

<div
class="event"
onclick="openCompetitionDetail(${index})">

${item.title}

</div>

`;

}

});

html += `
</div>
`;

}

html += `
</div>
`;

document
.getElementById(
"calendarScreen"
)
.innerHTML =
html;

}

/* =========================
CALENDAR MONTH
========================= */

function prevMonth(){

currentDate.setMonth(
currentDate.getMonth()-1
);

renderCalendar();

}

function nextMonth(){

currentDate.setMonth(
currentDate.getMonth()+1
);

renderCalendar();

}

/* =========================
SORT SEASON LIST
종료대회는 시즌 내에서
가장 먼저 열린 대회부터
========================= */

function getSeasonCompetitions(
season
){

const list =

competitions.filter(item=>

item.season===season

);

list.sort(
(a,b)=>

parseDate(a.start)
-
parseDate(b.start)
);

return list;

}
