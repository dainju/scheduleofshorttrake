<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
쇼트트랙 대회 일정
</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f8;
color:#222;
}

/* 헤더 */

header{
background:#afc2c9;
color:white;
padding:20px 20px 20px 70px;
font-size:26px;
font-weight:bold;
}

/* 햄버거 */

.menu-btn{

position:fixed;

top:12px;
left:12px;

width:48px;
height:48px;

border:none;

border-radius:10px;

background:white;

font-size:24px;

cursor:pointer;

z-index:2000;

box-shadow:
0 2px 8px rgba(0,0,0,.15);

}

/* 사이드바 */

.sidebar{

position:fixed;

top:0;
left:-280px;

width:280px;
height:100%;

background:white;

box-shadow:
2px 0 15px rgba(0,0,0,.15);

transition:.3s;

z-index:1500;

padding-top:70px;

overflow-y:auto;

}

.sidebar.open{
left:0;
}

.menu-item{

padding:16px 20px;

cursor:pointer;

border-bottom:
1px solid #eee;

font-size:16px;

}

.menu-item:hover{
background:#f7f7f7;
}

.menu-title{

padding:16px 20px;

font-weight:bold;

border-bottom:
1px solid #ddd;

background:#fafafa;

}

/* 본문 */

.container{

max-width:1200px;

margin:auto;

padding:20px;

}

/* 검색 */

.search{

width:100%;

padding:14px;

font-size:16px;

border:none;

border-radius:12px;

margin-bottom:20px;

box-shadow:
0 2px 8px rgba(0,0,0,.08);

}

/* 카드 */

.card{

background:white;

padding:18px;

border-radius:14px;

margin-bottom:15px;

cursor:pointer;

box-shadow:
0 2px 8px rgba(0,0,0,.08);

transition:.2s;

}

.card:hover{
transform:translateY(-2px);
}

.card-top{

display:flex;

justify-content:space-between;

margin-bottom:10px;

font-size:14px;

color:#666;

}

.dday{
font-weight:bold;
color:#d32f2f;
}

.title{

font-size:20px;
font-weight:bold;

margin-bottom:10px;

display:-webkit-box;

-webkit-line-clamp:2;
-webkit-box-orient:vertical;

overflow:hidden;

}

.place{
color:#0066cc;
}
  /* 달력 */

.calendar-nav{

display:flex;

justify-content:center;

align-items:center;

gap:15px;

margin-bottom:20px;

}

.calendar-nav button{

padding:8px 15px;

border:none;

border-radius:8px;

background:#afc2c9;

color:white;

cursor:pointer;

}

.calendar-grid{

display:grid;

grid-template-columns:
repeat(7,1fr);

gap:2px;

background:#ddd;

}

.day-header{

background:#afc2c9;

color:white;

padding:10px;

text-align:center;

font-weight:bold;

}

.day{

background:white;

min-height:110px;

padding:5px;

}

.day-number{

font-weight:bold;

margin-bottom:5px;

}

.event{

background:#e8f1ff;

padding:4px;

border-radius:5px;

margin-top:4px;

font-size:11px;

cursor:pointer;

}

/* 선수 */

.player-search{

width:100%;

padding:14px;

font-size:16px;

border:none;

border-radius:12px;

margin-bottom:20px;

box-shadow:
0 2px 8px rgba(0,0,0,.08);

}

.player-card{

background:white;

padding:15px;

border-radius:12px;

margin-bottom:10px;

box-shadow:
0 2px 8px rgba(0,0,0,.08);

}

.player-name{

font-size:18px;

font-weight:bold;

}

.player-team{

color:#666;

margin-top:5px;

}

/* 모달 */

.modal{

display:none;

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:
rgba(0,0,0,.55);

justify-content:center;
align-items:center;

z-index:3000;

padding:20px;

}

.modal-content{

background:white;

width:100%;
max-width:700px;

padding:25px;

border-radius:15px;

max-height:85vh;

overflow:auto;

}

.modal-title{

font-size:24px;

font-weight:bold;

margin-bottom:20px;

}

.info-row{

margin-bottom:14px;

line-height:1.7;

}

.close-btn{

float:right;

border:none;

background:#afc2c9;

color:white;

padding:8px 14px;

border-radius:8px;

cursor:pointer;

}

.hidden{
display:none;
}

@media(max-width:768px){

header{
font-size:22px;
}

.title{
font-size:18px;
}

.day{
min-height:80px;
}

.event{
font-size:10px;
}

}

</style>

</head>

class="menu-btn"

</button>

<header>
쇼트트랙 대회 일정

<div class="container">

<div

</div>

<div

class="hidden">
</div>

<div

</div>

id="playersTab"

<script>
  /* =========================
   구글 시트 주소
========================= */

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTRV-lLroEFMXiMaricD-GkYcWOyt8cwT6Z6f49GlqbJVwXMQdJllhzPc_gg8io9x6B-z0o_tk3Xbdl/pub?output=csv";

/* 선수 시트 */

const PLAYER_SHEET_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTyGAUBesyUjGuuAHSsJB0pVgTzPsW_D6H0i1U8mdflyI4zFPzmlwWYrMuXBIjSblX0c-7mVoFX3AW7/pub?output=csv";

/* =========================
   전역 변수
========================= */

let competitions = [];

let players = [];

let currentDate =
new Date();

/* 선수 메뉴 상태 */

let playerMode = "";

/*
main
national
business
university
*/

let playerCategory = "";

/*
남국대
여국대
강원도청
경희대
...
*/

/* =========================
   햄버거 메뉴
========================= */

function toggleMenu(){

document
.getElementById("sidebar")
.classList
.toggle("open");

}

/* =========================
   메뉴 메인
========================= */

function renderMainMenu(){

document
.getElementById("menuArea")
.innerHTML = `

<div class="menu-title">
메뉴
</div>

<div
class="menu-item"
onclick="selectMenu('schedule')">

전체 일정

</div>

<div
class="menu-item"
onclick="selectMenu('month')">

이번달 경기

</div>

<div
class="menu-item"
onclick="selectMenu('domestic')">

국내 대회

</div>

<div
class="menu-item"
onclick="selectMenu('international')">

국제 대회

</div>

<div
class="menu-item"
onclick="selectMenu('calendar')">

달력

</div>

<div
class="menu-item"
onclick="selectMenu('past')">

종료 대회

</div>

<div
class="menu-item"
onclick="openPlayerMenu()">

선수 >

</div>

`;

}

/* =========================
   선수 메인
========================= */

function openPlayerMenu(){

document
.getElementById("menuArea")
.innerHTML = `

<div
class="menu-item"
onclick="renderMainMenu()">

← 뒤로

</div>

<div class="menu-title">
선수
</div>

<div
class="menu-item"
onclick="openNationalMenu()">

국가대표 >

</div>

<div
class="menu-item"
onclick="openBusinessMenu()">

실업팀 >

</div>

<div
class="menu-item"
onclick="openUniversityMenu()">

대학부 >

</div>

`;

}

/* =========================
   국가대표
========================= */

function openNationalMenu(){

document
.getElementById("menuArea")
.innerHTML = `

<div
class="menu-item"
onclick="openPlayerMenu()">

← 뒤로

</div>

<div class="menu-title">
국가대표
</div>

<div
class="menu-item"
onclick="showPlayerCategory('26-27 남국대')">

남자 국가대표

</div>

<div
class="menu-item"
onclick="showPlayerCategory('26-27 여국대')">

여자 국가대표

</div>

`;

}
  /* =========================
   실업팀 메뉴
========================= */

function openBusinessMenu(){

const teams =
getBusinessTeams();

let html = `

<div
class="menu-item"
onclick="openPlayerMenu()">

← 뒤로

</div>

<div class="menu-title">
실업팀
</div>

`;

teams.forEach(team=>{

html += `

<div
class="menu-item"
onclick="showPlayerCategory('${team}')">

${team}

</div>

`;

});

document
.getElementById("menuArea")
.innerHTML = html;

}

/* =========================
   대학부 메뉴
========================= */

function openUniversityMenu(){

const teams =
getUniversityTeams();

let html = `

<div
class="menu-item"
onclick="openPlayerMenu()">

← 뒤로

</div>

<div class="menu-title">
대학부
</div>

`;

teams.forEach(team=>{

html += `

<div
class="menu-item"
onclick="showPlayerCategory('${team}')">

${team}

</div>

`;

});

document
.getElementById("menuArea")
.innerHTML = html;

}

/* =========================
   실업팀 목록 추출
========================= */

function getBusinessTeams(){

const ignore = [
"26-27 남국대",
"26-27 여국대",
"경희대",
"국민대",
"단국대",
"서울시립대",
"용인대",
"한국체대",
"한양대"
];

return players
.map(p=>p.team)
.filter(team=>
team &&
!ignore.includes(team)
)
.filter(
(team,index,array)=>
array.indexOf(team)
=== index
)
.sort();

}

/* =========================
   대학부 목록 추출
========================= */

function getUniversityTeams(){

const universities = [
"경희대",
"국민대",
"단국대",
"서울시립대",
"용인대",
"한국체대",
"한양대"
];

return universities.filter(team=>

players.some(
p=>p.team===team
)

);

}

/* =========================
   선수 카테고리 열기
========================= */

function showPlayerCategory(team){

playerCategory = team;

showTab("players");

renderPlayers();

document
.getElementById("sidebar")
.classList
.remove("open");

}

/* =========================
   선수 렌더링
========================= */

function renderPlayers(){

const keyword =
document
.getElementById("playerSearch")
.value
.toLowerCase();

const filtered =
players.filter(player=>{

const name =
(player.name || "")
.toLowerCase();

const team =
(player.team || "");

if(
playerCategory &&
team !== playerCategory
){
return false;
}

if(
keyword &&
!name.includes(keyword)
){
return false;
}

return true;

});

let html = "";

filtered.forEach(player=>{

html += `

<div class="player-card">

<div class="player-name">
${player.name}
</div>

<div class="player-team">
${player.team}
</div>

</div>

`;

});

if(!html){

html = `

<div class="player-card">
선수가 없습니다.
</div>

`;

}

document
.getElementById("playerList")
.innerHTML = html;

}
  /* =========================
   날짜 변환
========================= */

function parseDate(str){

if(!str)
return null;

const p =
str.trim().split(".");

if(
p.length !== 3
)
return null;

return new Date(
Number(p[0]),
Number(p[1])-1,
Number(p[2])
);

}

/* =========================
   날짜 표시
========================= */

function formatRange(start,end){

if(
!end ||
start===end
){

return start;

}

return `${start} ~ ${end}`;

}

/* =========================
   D-DAY
========================= */

function getDday(item){

const start =
parseDate(
item.start
);

if(!start)
return "";

const today =
new Date();

today.setHours(
0,0,0,0
);

const diff =
Math.ceil(
(start-today)
/
(1000*60*60*24)
);

if(diff>0){

return `D-${diff}`;

}

return "";

}

/* =========================
   상세 팝업
========================= */

function openModal(index){

const item =
competitions[index];

document
.getElementById("modalBody")
.innerHTML = `

<div class="modal-title">

${item.title}

</div>

<div class="info-row">

<b>기간</b><br>

${formatRange(
item.start,
item.end
)}

</div>

<div class="info-row">

<b>장소</b><br>

${item.place || "-"}

</div>

<div class="info-row">

<b>구분</b><br>

${item.type || "-"}

</div>

<div class="info-row">

<b>참가대상</b><br>

${item.target || "-"}

</div>

<div class="info-row">

<b>분류</b><br>

${item.category || "-"}

</div>

<div class="info-row">

<b>비고</b><br>

${item.note || "-"}

</div>

<div class="info-row">

<b>경기결과</b><br>

${item.result || "등록 전"}

</div>

`;

document
.getElementById("detailModal")
.style.display =
"flex";

}

/* =========================
   팝업 닫기
========================= */

function closeModal(){

document
.getElementById("detailModal")
.style.display =
"none";

}

/* =========================
   바깥 클릭
========================= */

window.addEventListener(
"click",
(e)=>{

const modal =
document.getElementById(
"detailModal"
);

if(
e.target === modal
){

closeModal();

}

}
);

/* =========================
   카드 생성
========================= */

function createCard(item,index){

return `

<div
class="card"
onclick="openModal(${index})">

<div class="card-top">

<div>

${formatRange(
item.start,
item.end
)}

</div>

<div class="dday">

${getDday(item)}

</div>

</div>

<div class="title">

${item.title}

</div>

<div class="place">

${item.place}

</div>

</div>

`;

}
  /* =========================
   탭 전환
========================= */

function showTab(tab){

[
"scheduleTab",
"monthTab",
"domesticTab",
"internationalTab",
"calendarTab",
"pastTab",
"playersTab"
].forEach(id=>{

document
.getElementById(id)
.classList
.add("hidden");

});

document
.getElementById(
tab+"Tab"
)
.classList
.remove("hidden");

}

/* =========================
   메뉴 선택
========================= */

function selectMenu(tab){

showTab(tab);

document
.getElementById("sidebar")
.classList
.remove("open");

}

/* =========================
   일정 렌더링
========================= */

function renderTabs(){

const schedule =
document.getElementById(
"scheduleTab"
);

const month =
document.getElementById(
"monthTab"
);

const domestic =
document.getElementById(
"domesticTab"
);

const international =
document.getElementById(
"internationalTab"
);

const past =
document.getElementById(
"pastTab"
);

const keyword =
document
.getElementById("search")
.value
.toLowerCase();

const today =
new Date();

today.setHours(
0,0,0,0
);

let allHtml = "";
let monthHtml = "";
let domesticHtml = "";
let internationalHtml = "";
let pastHtml = "";

/* 날짜순 정렬 */

const sorted =
[...competitions]
.sort((a,b)=>{

const da =
parseDate(a.start);

const db =
parseDate(b.start);

if(!da || !db)
return 0;

return da-db;

});

sorted.forEach(
(item,index)=>{

const title =
(item.title||"")
.toLowerCase();

const place =
(item.place||"")
.toLowerCase();

if(
keyword &&
!title.includes(keyword)
&&
!place.includes(keyword)
){
return;
}

const start =
parseDate(item.start);

const end =
parseDate(item.end);

const card =
createCard(
item,
competitions.indexOf(item)
);

/* 종료대회 */

if(
end &&
end < today
){

pastHtml += card;

return;

}

/* 전체일정 */

allHtml += card;

/* 국내 */

if(
item.type === "국내"
){

domesticHtml += card;

}

/* 국제 */

if(
item.type === "국제"
){

internationalHtml += card;

}

/* 이번달 */

if(start){

if(
start.getMonth()
===
today.getMonth()
&&
start.getFullYear()
===
today.getFullYear()
){

monthHtml += card;

}

}

});

schedule.innerHTML =
allHtml ||
"<div class='player-card'>대회가 없습니다.</div>";

month.innerHTML =
monthHtml ||
"<div class='player-card'>이번달 대회가 없습니다.</div>";

domestic.innerHTML =
domesticHtml ||
"<div class='player-card'>국내 대회가 없습니다.</div>";

international.innerHTML =
internationalHtml ||
"<div class='player-card'>국제 대회가 없습니다.</div>";

past.innerHTML =
pastHtml ||
"<div class='player-card'>종료된 대회가 없습니다.</div>";

}

/* =========================
   일정 검색
========================= */

document
.getElementById("search")
.addEventListener(
"input",
renderTabs
);

document
.getElementById("playerSearch")
.addEventListener(
"input",
renderPlayers
);
  /* =========================
   달력 렌더링
========================= */

function renderCalendar(){

const year =
currentDate.getFullYear();

const month =
currentDate.getMonth();

document
.getElementById(
"calendarTitle"
)
.textContent =
`${year}년 ${month+1}월`;

const firstDay =
new Date(
year,
month,
1
);

const lastDay =
new Date(
year,
month+1,
0
);

let html = `
<div class="calendar-grid">
`;

/* 요일 */

[
"일",
"월",
"화",
"수",
"목",
"금",
"토"
].forEach(day=>{

html += `
<div class="day-header">
${day}
</div>
`;

});

/* 시작 공백 */

for(
let i=0;
i<firstDay.getDay();
i++
){

html += `
<div class="day"></div>
`;

}

/* 날짜 */

for(
let day=1;
day<=lastDay.getDate();
day++
){

html += `

<div class="day">

<div class="day-number">
${day}
</div>

`;

competitions.forEach(
(item,index)=>{

const start =
parseDate(item.start);

const end =
parseDate(item.end);

if(
!start ||
!end
){
return;
}

const current =
new Date(
year,
month,
day
);

if(
current >= start &&
current <= end
){

html += `

<div
class="event"
onclick="openModal(${index})">

${item.title}

</div>

`;

}

});

html += `
</div>
`;

}

html += `
</div>
`;

document
.getElementById(
"calendarContainer"
)
.innerHTML = html;

}

/* =========================
   이전 달
========================= */

document
.getElementById(
"prevMonth"
)
.addEventListener(
"click",
()=>{

currentDate.setMonth(
currentDate.getMonth()-1
);

renderCalendar();

}
);

/* =========================
   다음 달
========================= */

document
.getElementById(
"nextMonth"
)
.addEventListener(
"click",
()=>{

currentDate.setMonth(
currentDate.getMonth()+1
);

renderCalendar();

}
);
  /* =========================
   CSV 파싱
========================= */

function parseCSVLine(line){

const result = [];

let current = "";

let insideQuotes = false;

for(
let i=0;
i<line.length;
i++
){

const char = line[i];

if(char === '"'){

insideQuotes =
!insideQuotes;

continue;

}

if(
char === "," &&
!insideQuotes
){

result.push(current);

current = "";

continue;

}

current += char;

}

result.push(current);

return result;

}

/* =========================
   대회 데이터 로드
========================= */

async function loadData(){

try{

const response =
await fetch(
CSV_URL
);

const text =
await response.text();

const rows =
text
.trim()
.split("\n");

rows.shift();

competitions = [];

rows.forEach(row=>{

const c =
parseCSVLine(row);

competitions.push({

start: c[0] || "",
end: c[1] || "",
title: c[2] || "",
place: c[3] || "",
type: c[4] || "",
target: c[5] || "",
category: c[6] || "",
note: c[7] || "",
result: c[8] || ""

});

});

/* 시작일 기준 정렬 */

competitions.sort(
(a,b)=>{

const da =
parseDate(a.start);

const db =
parseDate(b.start);

if(!da || !db){
return 0;
}

return da-db;

}
);

renderTabs();

renderCalendar();

}catch(error){

console.error(
"대회 데이터 로드 실패",
error
);

document
.getElementById(
"scheduleTab"
)
.innerHTML = `

<div class="player-card">
대회 데이터를 불러오지 못했습니다.
</div>

`;

}

}
  /* =========================
   선수 데이터 로드
========================= */

async function loadPlayers(){

try{

const response =
await fetch(
PLAYER_SHEET_URL
);

const text =
await response.text();

const rows =
text
.trim()
.split("\n");

players = [];

rows.forEach(
(row,rowIndex)=>{

if(rowIndex===0)
return;

const cols =
parseCSVLine(row);

/* A열 남국대 */

if(cols[0]){

players.push({

name:
cols[0].trim(),

team:
"26-27 남국대"

});

}

/* B열 여국대 */

if(cols[1]){

players.push({

name:
cols[1].trim(),

team:
"26-27 여국대"

});

}

/* C~I 실업팀 */

const businessTeams = [

"강원도청",
"고양시청",
"서울시청",
"성남시청",
"스포츠토토",
"전북도청",
"화성시청"

];

for(
let i=2;
i<=8;
i++
){

if(cols[i]){

players.push({

name:
cols[i].trim(),

team:
businessTeams[i-2]

});

}

}

/* J~Q 대학부 */

const universities = [

"경희대",
"고려대",
"국민대",
"단국대",
"서울시립대",
"용인대",
"한국체대",
"한양대"

];

for(
let i=9;
i<=16;
i++
){

if(cols[i]){

players.push({

name:
cols[i].trim(),

team:
universities[i-9]

});

}

}

}
);

}catch(error){

console.error(
"선수 데이터 로드 실패",
error
);

}

}
  /* =========================
   초기 메뉴 생성
========================= */

renderMainMenu();

/* =========================
   기본 화면
========================= */

showTab(
"schedule"
);

/* =========================
   데이터 로드
========================= */

loadData();

loadPlayers();

========================= */

document.addEventListener(
"click",
(e)=>{

const sidebar =
document.getElementById(
"sidebar"
);

const button =
document.querySelector(
".menu-btn"
);

if(
sidebar.classList.contains(

)

)
&&

);

}
);

</script>
