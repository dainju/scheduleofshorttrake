<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>쇼트트랙 대회 일정</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f8;
color:#222;
}

/* 헤더 */

header{
background:#003b78;
color:white;
padding:20px 20px 20px 70px;
font-size:26px;
font-weight:bold;
}

/* 햄버거 버튼 */

.menu-btn{

position:fixed;

top:12px;
left:12px;

width:48px;
height:48px;

border:none;

border-radius:10px;

background:white;

font-size:24px;

cursor:pointer;

box-shadow:0 2px 8px rgba(0,0,0,.15);

z-index:1001;

}

/* 사이드 메뉴 */

.sidebar{

position:fixed;

top:0;
left:-260px;

width:250px;
height:100%;

background:white;

box-shadow:2px 0 15px rgba(0,0,0,.15);

transition:.3s;

padding-top:80px;

z-index:1000;

}

.sidebar.open{
left:0;
}

.sidebar button{

width:100%;

padding:16px;

border:none;

background:none;

text-align:left;

font-size:16px;

cursor:pointer;

}

.sidebar button:hover{
background:#f3f4f6;
}

/* 본문 */

.container{

max-width:1200px;

margin:auto;

padding:20px;

}

/* 검색창 */

.search{

width:100%;

padding:14px;

font-size:16px;

border:none;

border-radius:12px;

margin-bottom:20px;

box-shadow:0 2px 8px rgba(0,0,0,.08);

}

/* 카드 */

.card{

background:white;

padding:18px;

border-radius:14px;

margin-bottom:15px;

cursor:pointer;

box-shadow:0 2px 8px rgba(0,0,0,.08);

transition:.2s;

}

.card:hover{
transform:translateY(-2px);
}

/* 날짜 + DDAY */

.card-top{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:10px;

font-size:14px;

color:#666;

}

.dday{

font-weight:bold;

color:#d32f2f;

}

/* 대회명 */

.title{

font-size:20px;

font-weight:bold;

margin-bottom:10px;

display:-webkit-box;

-webkit-line-clamp:2;
-webkit-box-orient:vertical;

overflow:hidden;

text-overflow:ellipsis;

}

/* 장소 */

.place{

color:#0066cc;

}

/* 달력 */

.calendar-nav{

display:flex;

justify-content:center;

align-items:center;

gap:15px;

margin-bottom:20px;

}

.calendar-nav button{

padding:8px 15px;

border:none;

border-radius:8px;

background:#003b78;

color:white;

cursor:pointer;

}

.calendar-grid{

display:grid;

grid-template-columns:repeat(7,1fr);

gap:2px;

background:#ddd;

}

.day-header{

background:#003b78;

color:white;

padding:10px;

text-align:center;

font-weight:bold;

}

.day{

background:white;

min-height:110px;

padding:5px;

}

.day-number{

font-weight:bold;

margin-bottom:5px;

}

.event{

background:#e8f1ff;

padding:4px;

border-radius:5px;

margin-top:4px;

font-size:11px;

cursor:pointer;

}

/* 숨김 */

.hidden{
display:none;
}

/* 상세정보 모달 */

.modal{

display:none;

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,.55);

justify-content:center;
align-items:center;

z-index:2000;

padding:20px;

}

.modal-content{

background:white;

width:100%;
max-width:700px;

padding:25px;

border-radius:15px;

max-height:85vh;

overflow:auto;

}

.modal-title{

font-size:24px;

font-weight:bold;

margin-bottom:20px;

}

.info-row{

margin-bottom:14px;

line-height:1.7;

}

.close-btn{

float:right;

border:none;

background:#003b78;

color:white;

padding:8px 14px;

border-radius:8px;

cursor:pointer;

}

/* 모바일 */

@media(max-width:768px){

header{
font-size:22px;
}

.title{
font-size:18px;
}

.day{
min-height:80px;
}

.event{
font-size:10px;
}

}

</style>
</head>

<body>

<button
class="menu-btn"
onclick="toggleMenu()">
☰
</button>

<div id="sidebar" class="sidebar">

<button onclick="selectMenu('schedule')">
전체 일정
</button>

<button onclick="selectMenu('month')">
이번달 경기
</button>

<button onclick="selectMenu('domestic')">
국내 대회
</button>

<button onclick="selectMenu('international')">
국제 대회
</button>

<button onclick="selectMenu('calendar')">
달력
</button>

<button onclick="selectMenu('past')">
종료 대회
</button>

</div>

<header>
쇼트트랙 대회 일정
</header>

<div class="container">

<input
type="text"
id="search"
class="search"
placeholder="대회명 또는 장소 검색">

<div id="scheduleTab"></div>

<div id="monthTab" class="hidden"></div>

<div id="domesticTab" class="hidden"></div>

<div id="internationalTab" class="hidden"></div>

<div id="calendarTab" class="hidden">

<div class="calendar-nav">

<button id="prevMonth">◀</button>

<h2 id="calendarTitle"></h2>

<button id="nextMonth">▶</button>

</div>

<div id="calendarContainer"></div>

</div>

<div id="pastTab" class="hidden"></div>

</div>

<div id="detailModal" class="modal">

<div class="modal-content">

<button
class="close-btn"
onclick="closeModal()">
닫기
</button>

<div id="modalBody"></div>

</div>

</div>
<script>

let competitions = [];
let currentDate = new Date();

/* 날짜 변환 */

function parseDate(str){

if(!str) return null;

const p = str.trim().split(".");

if(p.length !== 3) return null;

return new Date(
Number(p[0]),
Number(p[1])-1,
Number(p[2])
);

}

/* 날짜 표시 */

function formatRange(start,end){

if(!end || start===end){
return start;
}

return `${start} ~ ${end}`;

}

/* DDAY */

function getDday(item){

const start =
parseDate(item.start);

if(!start){
return "";
}

const today =
new Date();

today.setHours(
0,0,0,0
);

const diff =
Math.ceil(
(start-today)
/(1000*60*60*24)
);

if(diff>0){

return `D-${diff}`;

}

return "";

}

/* 상세정보 */

function openModal(index){

const item =
competitions[index];

document
.getElementById("modalBody")
.innerHTML = `

<div class="modal-title">
${item.title}
</div>

<div class="info-row">
<b>기간</b><br>
${formatRange(item.start,item.end)}
</div>

<div class="info-row">
<b>장소</b><br>
${item.place || "-"}
</div>

<div class="info-row">
<b>구분</b><br>
${item.type || "-"}
</div>

<div class="info-row">
<b>참가대상</b><br>
${item.target || "-"}
</div>

<div class="info-row">
<b>분류</b><br>
${item.category || "-"}
</div>

<div class="info-row">
<b>비고</b><br>
${item.note || "-"}
</div>

<div class="info-row">
<b>경기결과</b><br>
${item.result || "등록 전"}
</div>

`;

document
.getElementById("detailModal")
.style.display =
"flex";

}

function closeModal(){

document
.getElementById("detailModal")
.style.display =
"none";

}

/* 모달 바깥 클릭 */

window.addEventListener(
"click",
(e)=>{

const modal =
document.getElementById(
"detailModal"
);

if(
e.target===modal
){
closeModal();
}

}
);

/* 카드 생성 */

function createCard(item,index){

return `

<div
class="card"
onclick="openModal(${index})">

<div class="card-top">

<div>
${formatRange(
item.start,
item.end
)}
</div>

<div class="dday">
${getDday(item)}
</div>

</div>

<div class="title">
${item.title}
</div>

<div class="place">
${item.place}
</div>

</div>

`;

}

/* 햄버거 메뉴 */

function toggleMenu(){

document
.getElementById("sidebar")
.classList
.toggle("open");

}

function selectMenu(tab){

showTab(tab);

document
.getElementById("sidebar")
.classList
.remove("open");

}

/* 탭 전환 */

function showTab(tab){

[
"scheduleTab",
"monthTab",
"domesticTab",
"internationalTab",
"calendarTab",
"pastTab"
].forEach(id=>{

document
.getElementById(id)
.classList
.add("hidden");

});

document
.getElementById(
tab+"Tab"
)
.classList
.remove("hidden");

}

function renderTabs(){

const schedule =
document.getElementById(
"scheduleTab"
