<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
쇼트트랙 대회 일정
</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#f4f6f8;

color:#222;

}

/* 헤더 */

header{

background:#afc2c9;

color:white;

padding:20px 20px 20px 70px;

font-size:26px;

font-weight:bold;

}

/* 햄버거 버튼 */

.menu-btn{

position:fixed;

top:12px;
left:12px;

width:48px;
height:48px;

border:none;

border-radius:10px;

background:white;

font-size:24px;

cursor:pointer;

box-shadow:0 2px 8px rgba(0,0,0,.15);

z-index:1001;

}

/* 사이드바 */

.sidebar{

position:fixed;

top:0;
left:-320px;

width:320px;
height:100%;

background:white;

overflow-y:auto;

box-shadow:2px 0 15px rgba(0,0,0,.15);

transition:.3s;

z-index:1000;

padding-top:80px;

}

.sidebar.open{

left:0;

}

/* 메뉴 */

.menu-title{

padding:16px;

font-size:18px;

font-weight:bold;

border-bottom:1px solid #eee;

}

.menu-item{

padding:14px 16px;

cursor:pointer;

border-bottom:1px solid #f2f2f2;

}

.menu-item:hover{

background:#f7f7f7;

}

details{

border-bottom:1px solid #f2f2f2;

}

summary{

list-style:none;

cursor:pointer;

padding:14px 16px;

font-weight:500;

}

summary::-webkit-details-marker{

display:none;

}

.player-name{

padding:10px 34px;

font-size:14px;

color:#444;

background:#fafafa;

}

/* 본문 */

.container{

max-width:1200px;

margin:auto;

padding:20px;

}

/* 검색창 */

.search{

width:100%;

padding:14px;

font-size:16px;

border:none;

border-radius:12px;

margin-bottom:20px;

box-shadow:0 2px 8px rgba(0,0,0,.08);

}
  /* 카드 */

.card{

background:white;

padding:18px;

border-radius:14px;

margin-bottom:15px;

cursor:pointer;

box-shadow:0 2px 8px rgba(0,0,0,.08);

transition:.2s;

}

.card:hover{

transform:translateY(-2px);

}

/* 카드 상단 */

.card-top{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:10px;

font-size:14px;

color:#666;

}

/* DDAY */

.dday{

font-weight:bold;

color:#d32f2f;

}

/* 대회명 */

.title{

font-size:20px;

font-weight:bold;

margin-bottom:10px;

display:-webkit-box;

-webkit-line-clamp:2;

-webkit-box-orient:vertical;

overflow:hidden;

text-overflow:ellipsis;

}

/* 장소 */

.place{

color:#afc2c9;

font-weight:500;

}

/* 달력 */

.calendar-nav{

display:flex;

justify-content:center;

align-items:center;

gap:15px;

margin-bottom:20px;

}

.calendar-nav button{

padding:8px 15px;

border:none;

border-radius:8px;

background:#afc2c9;

color:white;

cursor:pointer;

}

.calendar-grid{

display:grid;

grid-template-columns:repeat(7,1fr);

gap:2px;

background:#ddd;

}

.day-header{

background:#afc2c9;

color:white;

padding:10px;

text-align:center;

font-weight:bold;

}

.day{

background:white;

min-height:110px;

padding:5px;

}

.day-number{

font-weight:bold;

margin-bottom:5px;

}

.event{

background:#eef7fb;

padding:4px;

border-radius:5px;

margin-top:4px;

font-size:11px;

cursor:pointer;

overflow:hidden;

white-space:nowrap;

text-overflow:ellipsis;

}

/* 숨김 */

.hidden{

display:none;

}

/* 모달 */

.modal{

display:none;

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,.55);

justify-content:center;

align-items:center;

z-index:2000;

padding:20px;

}

.modal-content{

background:white;

width:100%;

max-width:700px;

padding:25px;

border-radius:15px;

max-height:85vh;

overflow:auto;

}

.modal-title{

font-size:24px;

font-weight:bold;

margin-bottom:20px;

}

.info-row{

margin-bottom:14px;

line-height:1.7;

}

.close-btn{

float:right;

border:none;

background:#afc2c9;

color:white;

padding:8px 14px;

border-radius:8px;

cursor:pointer;

}

/* 모바일 */

@media(max-width:768px){

header{

font-size:22px;

}

.title{

font-size:18px;

}

.day{

min-height:80px;

}

.event{

font-size:10px;

}

.sidebar{

width:280px;

}

}

</style>

</head>

<body>

<button
class="menu-btn"
onclick="toggleMenu()">
☰
</button>

<div
id="sidebar"
class="sidebar">

<div id="menuArea">
</div>

</div>

<header>

쇼트트랙 대회 일정

</header>

<div class="container">

<input
type="text"
id="search"
class="search"
placeholder="대회명 또는 장소 검색">

<div id="scheduleTab"></div>

<div
id="monthTab"
class="hidden">
</div>

<div
id="domesticTab"
class="hidden">
</div>

<div
id="internationalTab"
class="hidden">
</div>

<div
id="calendarTab"
class="hidden">

<div class="calendar-nav">

<button id="prevMonth">
◀
</button>

<h2 id="calendarTitle">
</h2>

<button id="nextMonth">
▶
</button>

</div>

<div id="calendarContainer">
</div>

</div>

<div
id="pastTab"
class="hidden">
</div>

</div>

<div
id="detailModal"
class="modal">

<div class="modal-content">

<button
class="close-btn"
onclick="closeModal()">

닫기

</button>

<div id="modalBody">
</div>

</div>

</div>

<script>
  /* =========================
   구글 시트 주소
========================= */

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTRV-lLroEFMXiMaricD-GkYcWOyt8cwT6Z6f49GlqbJVwXMQdJllhzPc_gg8io9x6B-z0o_tk3Xbdl/pub?output=csv";

const PLAYER_SHEET_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTyGAUBesyUjGuuAHSsJB0pVgTzPsW_D6H0i1U8mdflyI4zFPzmlwWYrMuXBIjSblX0c-7mVoFX3AW7/pub?output=csv";

/* =========================
   전역 변수
========================= */

let competitions = [];

let players = [];

let currentDate =
new Date();

/* =========================
   날짜 변환
========================= */

function parseDate(str){

if(!str)
return null;

const p =
str.trim().split(".");

if(
p.length !== 3
){
return null;
}

return new Date(
Number(p[0]),
Number(p[1])-1,
Number(p[2])
);

}

/* =========================
   날짜 범위
========================= */

function formatRange(
start,
end
){

if(
!end ||
start===end
){

return start;

}

return `${start} ~ ${end}`;

}

/* =========================
   D-DAY
========================= */

function getDday(item){

const start =
parseDate(
item.start
);

if(!start)
return "";

const today =
new Date();

today.setHours(
0,0,0,0
);

const diff =
Math.ceil(
(start-today)
/
(1000*60*60*24)
);

if(diff > 0){

return `D-${diff}`;

}

if(diff === 0){

return "D-DAY";

}

return "";

}

/* =========================
   상세 모달 열기
========================= */

function openModal(index){

const item =
competitions[index];

document
.getElementById(
"modalBody"
)
.innerHTML = `

<div class="modal-title">

${item.title}

</div>

<div class="info-row">

<b>기간</b><br>

${formatRange(
item.start,
item.end
)}

</div>

<div class="info-row">

<b>장소</b><br>

${item.place || "-"}

</div>

<div class="info-row">

<b>구분</b><br>

${item.type || "-"}

</div>

<div class="info-row">

<b>참가대상</b><br>

${item.target || "-"}

</div>

<div class="info-row">

<b>분류</b><br>

${item.category || "-"}

</div>

<div class="info-row">

<b>비고</b><br>

${item.note || "-"}

</div>

<div class="info-row">

<b>경기결과</b><br>

${item.result || "등록 전"}

</div>

`;

document
.getElementById(
"detailModal"
)
.style.display =
"flex";

}
  /* =========================
   모달 닫기
========================= */

function closeModal(){

document
.getElementById(
"detailModal"
)
.style.display =
"none";

}

window.addEventListener(
"click",
(e)=>{

const modal =
document.getElementById(
"detailModal"
);

if(
e.target===modal
){

closeModal();

}

}
);

/* =========================
   카드 생성
========================= */

function createCard(
item,
index
){

return `

<div
class="card"
onclick="openModal(${index})">

<div class="card-top">

<div>

${formatRange(
item.start,
item.end
)}

</div>

<div class="dday">

${getDday(item)}

</div>

</div>

<div class="title">

${item.title}

</div>

<div class="place">

${item.place || ""}

</div>

</div>

`;

}

/* =========================
   햄버거 메뉴
========================= */

function toggleMenu(){

document
.getElementById(
"sidebar"
)
.classList
.toggle(
"open"
);

}

/* =========================
   실업팀 목록
========================= */

function getBusinessTeams(){

const universityList = [

"경희대",
"고려대",
"국민대",
"단국대",
"서울시립대",
"용인대",
"한국체대",
"한양대"

];

return players

.filter(player=>

player.team &&
player.team !== "26-27 남국대" &&
player.team !== "26-27 여국대" &&
!universityList.includes(
player.team
)

)

.map(player=>player.team)

.filter(
(team,index,array)=>

array.indexOf(team)
=== index

)

.sort();

}

/* =========================
   대학부 목록
========================= */

function getUniversityTeams(){

const universityList = [

"경희대",
"고려대",
"국민대",
"단국대",
"서울시립대",
"용인대",
"한국체대",
"한양대"

];

return universityList.filter(team=>

players.some(
player=>
player.team===team
)

);

}

/* =========================
   메뉴 생성
========================= */

function renderMainMenu(){

const businessTeams =
getBusinessTeams();

const universityTeams =
getUniversityTeams();

let businessHtml = "";
let universityHtml = "";

/* 실업팀 */

businessTeams.forEach(team=>{

const teamPlayers =
players.filter(
p=>p.team===team
);

businessHtml += `

<details>

<summary>
${team}
</summary>

${teamPlayers.map(player=>`

<div class="player-name">
${player.name}
</div>

`).join("")}

</details>

`;

});

/* 대학부 */

universityTeams.forEach(team=>{

const teamPlayers =
players.filter(
p=>p.team===team
);

universityHtml += `

<details>

<summary>
${team}
</summary>

${teamPlayers.map(player=>`

<div class="player-name">
${player.name}
</div>

`).join("")}

</details>

`;

});

document
.getElementById(
"menuArea"
)
.innerHTML = `

<div class="menu-title">
메뉴
</div>

<div
class="menu-item"
onclick="selectMenu('schedule')">
전체 일정
</div>

<div
class="menu-item"
onclick="selectMenu('month')">
이번달 경기
</div>

<div
class="menu-item"
onclick="selectMenu('domestic')">
국내 대회
</div>

<div
class="menu-item"
onclick="selectMenu('international')">
국제 대회
</div>

<div
class="menu-item"
onclick="selectMenu('calendar')">
달력
</div>

<div
class="menu-item"
onclick="selectMenu('past')">
종료 대회
</div>

<details>

<summary>
선수
</summary>

<details>

<summary>
국가대표
</summary>

<details>

<summary>
남자 국가대표
</summary>

${players
.filter(
p=>p.team==="26-27 남국대"
)
.map(player=>`

<div class="player-name">
${player.name}
</div>

`).join("")}

</details>

<details>

<summary>
여자 국가대표
</summary>

${players
.filter(
p=>p.team==="26-27 여국대"
)
.map(player=>`

<div class="player-name">
${player.name}
</div>

`).join("")}

</details>

</details>

<details>

<summary>
실업팀
</summary>

${businessHtml}

</details>

<details>

<summary>
대학부
</summary>

${universityHtml}

</details>

</details>

`;

}
  /* =========================
   탭 전환
========================= */

function showTab(tab){

[
"scheduleTab",
"monthTab",
"domesticTab",
"internationalTab",
"calendarTab",
"pastTab"
].forEach(id=>{

document
.getElementById(id)
.classList
.add("hidden");

});

document
.getElementById(
tab + "Tab"
)
.classList
.remove("hidden");

}

/* =========================
   메뉴 선택
========================= */

function selectMenu(tab){

showTab(tab);

document
.getElementById(
"sidebar"
)
.classList
.remove(
"open"
);

}

/* =========================
   일정 렌더링
========================= */

function renderTabs(){

const schedule =
document.getElementById(
"scheduleTab"
);

const month =
document.getElementById(
"monthTab"
);

const domestic =
document.getElementById(
"domesticTab"
);

const international =
document.getElementById(
"internationalTab"
);

const past =
document.getElementById(
"pastTab"
);

const keyword =
document
.getElementById(
"search"
)
.value
.toLowerCase();

const today =
new Date();

today.setHours(
0,0,0,0
);

let allHtml = "";
let monthHtml = "";
let domesticHtml = "";
let internationalHtml = "";
let pastHtml = "";

/* 날짜순 정렬 */

const sorted =

[...competitions]

.sort((a,b)=>{

const da =
parseDate(a.start);

const db =
parseDate(b.start);

if(
!da ||
!db
){
return 0;
}

return da-db;

});

sorted.forEach(item=>{

const title =
(item.title||"")
.toLowerCase();

const place =
(item.place||"")
.toLowerCase();

if(
keyword &&
!title.includes(keyword) &&
!place.includes(keyword)
){

return;

}

const start =
parseDate(item.start);

const end =
parseDate(item.end);

const card =
createCard(
item,
competitions.indexOf(item)
);

/* 종료대회 */

if(
end &&
end < today
){

pastHtml += card;

return;

}

/* 전체 일정 */

allHtml += card;

/* 국내 */

if(
item.type === "국내"
){

domesticHtml += card;

}

/* 국제 */

if(
item.type === "국제"
){

internationalHtml += card;

}

/* 이번달 */

if(start){

if(
start.getMonth()
===
today.getMonth()
&&
start.getFullYear()
===
today.getFullYear()
){

monthHtml += card;

}

}

});

schedule.innerHTML =
allHtml ||
"<div class='card'>대회가 없습니다.</div>";

month.innerHTML =
monthHtml ||
"<div class='card'>이번 달 대회가 없습니다.</div>";

domestic.innerHTML =
domesticHtml ||
"<div class='card'>국내 대회가 없습니다.</div>";

international.innerHTML =
internationalHtml ||
"<div class='card'>국제 대회가 없습니다.</div>";

past.innerHTML =
pastHtml ||
"<div class='card'>종료된 대회가 없습니다.</div>";

}

/* =========================
   검색
========================= */

document
.getElementById(
"search"
)
.addEventListener(
"input",
renderTabs
);
  /* =========================
   달력 렌더링
========================= */

function renderCalendar(){

const year =
currentDate.getFullYear();

const month =
currentDate.getMonth();

document
.getElementById(
"calendarTitle"
)
.textContent =
`${year}년 ${month+1}월`;

const firstDay =
new Date(
year,
month,
1
);

const lastDay =
new Date(
year,
month+1,
0
);

let html = `
<div class="calendar-grid">
`;

/* 요일 */

[
"일",
"월",
"화",
"수",
"목",
"금",
"토"
].forEach(day=>{

html += `
<div class="day-header">
${day}
</div>
`;

});

/* 시작 공백 */

for(
let i=0;
i<firstDay.getDay();
i++
){

html += `
<div class="day"></div>
`;

}

/* 날짜 */

for(
let day=1;
day<=lastDay.getDate();
day++
){

html += `

<div class="day">

<div class="day-number">

${day}

</div>

`;

competitions.forEach(
(item,index)=>{

const start =
parseDate(
item.start
);

const end =
parseDate(
item.end
);

if(
!start ||
!end
){
return;
}

const current =
new Date(
year,
month,
day
);

if(
current >= start &&
current <= end
){

html += `

<div
class="event"
onclick="openModal(${index})">

${item.title}

</div>

`;

}

});

html += `

</div>

`;

}

html += `
</div>
`;

document
.getElementById(
"calendarContainer"
)
.innerHTML =
html;

}

/* =========================
   이전 달
========================= */

document
.getElementById(
"prevMonth"
)
.addEventListener(
"click",
()=>{

currentDate.setMonth(
currentDate.getMonth()-1
);

renderCalendar();

}
);

/* =========================
   다음 달
========================= */

document
.getElementById(
"nextMonth"
)
.addEventListener(
"click",
()=>{

currentDate.setMonth(
currentDate.getMonth()+1
);

renderCalendar();

}
);
  /* =========================
   CSV 한 줄 파싱
========================= */

function parseCSVLine(line){

const result = [];

let current = "";

let insideQuotes = false;

for(
let i=0;
i<line.length;
i++
){

const char = line[i];

if(char === '"'){

insideQuotes =
!insideQuotes;

continue;

}

if(
char === "," &&
!insideQuotes
){

result.push(current);

current = "";

continue;

}

current += char;

}

result.push(current);

return result;

}

/* =========================
   대회 데이터 불러오기
========================= */

async function loadData(){

try{

const response =
await fetch(
CSV_URL
);

const text =
await response.text();

const rows =
text
.trim()
.split("\n");

/* 헤더 제거 */

rows.shift();

competitions = [];

rows.forEach(row=>{

const c =
parseCSVLine(row);

competitions.push({

start:
c[0] || "",

end:
c[1] || "",

title:
c[2] || "",

place:
c[3] || "",

type:
c[4] || "",

target:
c[5] || "",

category:
c[6] || "",

note:
c[7] || "",

result:
c[8] || ""

});

});

/* 시작일 기준 정렬 */

competitions.sort(
(a,b)=>{

const da =
parseDate(a.start);

const db =
parseDate(b.start);

if(
!da ||
!db
){
return 0;
}

return da-db;

}
);

/* 화면 렌더링 */

renderTabs();

renderCalendar();

}catch(error){

console.error(
"대회 데이터 로드 실패",
error
);

document
.getElementById(
"scheduleTab"
)
.innerHTML = `

<div class="card">

데이터를 불러오지 못했습니다.

</div>

`;

}

}
  /* =========================
   선수 데이터 불러오기
========================= */

async function loadPlayers(){

try{

const response =
await fetch(
PLAYER_SHEET_URL
);

const text =
await response.text();

const rows =
text
.trim()
.split("\n");

/* 헤더 제거 */

rows.shift();

players = [];

rows.forEach(row=>{

const c =
parseCSVLine(row);

/*
A열 = 이름
B열 = 소속
*/

players.push({

name:
(c[0] || "").trim(),

team:
(c[1] || "").trim()

});

});
