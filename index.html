<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>쇼트트랙 대회 일정</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f4f6f8;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

header{
    background:#003366;
    color:white;
    padding:20px;
    text-align:center;
}

.search-box{
    max-width:900px;
    margin:20px auto;
    padding:0 15px;
}

.search-box input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    font-size:16px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:0 15px 30px;
}

.card{
    background:white;
    border-radius:12px;
    margin-bottom:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    overflow:hidden;
}

.summary{
    padding:15px;
    cursor:pointer;
}

.date{
    color:#666;
    font-size:14px;
}

.title{
    font-size:18px;
    font-weight:700;
    margin:8px 0;
}

.place{
    color:#0066cc;
}

.detail{
    display:none;
    border-top:1px solid #eee;
    padding:15px;
    background:#fafafa;
}

.detail p{
    margin:8px 0;
}

.open .detail{
    display:block;
}
</style>
</head>

<body>

<header>
<h1>쇼트트랙 대회 일정</h1>
</header>

<div class="search-box">
<input
id="search"
type="text"
placeholder="대회명, 장소 검색">
</div>

<div id="container" class="container">
불러오는 중...
</div>

<script>

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTXTlj2pF8TCG8PquxO8k_D1ehwsmFRZAt4hLZgPEp-MwndhhcguvcDRlwoX3SBJUd3G-RER-2TMeIO/pub?output=csv";

let allData = [];

function parseDate(str){

    if(!str) return new Date(9999,0,1);

    const clean = str.replace(/\./g,"-");

    return new Date(clean);
}

async function loadData(){

    try{

        const response = await fetch(CSV_URL);

        const text = await response.text();

        const rows = text.trim().split("\n");

        rows.shift();

        allData = rows.map(row=>{

            const cols = row.split(",");

            return {
                date: cols[0] || "",
                title: cols[1] || "",
                place: cols[2] || "",
                type: cols[3] || "",
                target: cols[4] || "",
                category: cols[5] || "",
                result: cols[6] || ""
            };

        });

        allData.sort((a,b)=>
            parseDate(a.date)-parseDate(b.date)
        );

        render(allData);

    }catch(err){

        document.getElementById("container").innerHTML =
        "<h3>데이터를 불러오지 못했습니다.</h3>";

        console.error(err);
    }
}

function render(data){

    const container =
    document.getElementById("container");

    container.innerHTML = "";

    data.forEach(item=>{

        const card =
        document.createElement("div");

        card.className = "card";

        card.innerHTML = `
            <div class="summary">
                <div class="date">${item.date}</div>
                <div class="title">${item.title}</div>
                <div class="place">${item.place}</div>
            </div>

            <div class="detail">
                <p><b>구분</b> : ${item.type}</p>
                <p><b>참가대상</b> : ${item.target}</p>
                <p><b>분류</b> : ${item.category}</p>
                <p><b>경기결과</b> : ${item.result || "등록 전"}</p>
            </div>
        `;

        card.querySelector(".summary")
            .addEventListener("click",()=>{
                card.classList.toggle("open");
            });

        container.appendChild(card);

    });

}

document
.getElementById("search")
.addEventListener("input",e=>{

    const keyword =
    e.target.value.toLowerCase();

    const filtered =
    allData.filter(item=>

        item.title.toLowerCase().includes(keyword) ||

        item.place.toLowerCase().includes(keyword)

    );

    render(filtered);

});

loadData();

</script>

</body>
</html>
