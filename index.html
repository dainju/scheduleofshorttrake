/* =========================
   날짜 변환
========================= */

function parseDate(str){

if(!str)
return null;

const p =
str.trim().split(".");

if(
p.length !== 3
){

return null;

}

return new Date(

Number(p[0]),
Number(p[1])-1,
Number(p[2])

);

}

/* =========================
   날짜 표시
========================= */

function formatRange(
start,
end
){

if(
!end ||
start===end
){

return start;

}

return `${start} ~ ${end}`;

}

/* =========================
   DDAY
========================= */

function getDday(item){

const start =
parseDate(
item.start
);

if(!start)
return "";

const today =
new Date();

today.setHours(
0,0,0,0
);

const diff =
Math.ceil(
(start-today)
/
(1000*60*60*24)
);

if(diff > 0){

return `D-${diff}`;

}

if(diff === 0){

return "D-DAY";

}

return "";

}

/* =========================
   CSV 한 줄 파싱
========================= */

function parseCSVLine(line){

const result = [];

let current = "";

let insideQuotes = false;

for(
let i=0;
i<line.length;
i++
){

const char = line[i];

if(char === '"'){

insideQuotes =
!insideQuotes;

continue;

}

if(
char === "," &&
!insideQuotes
){

result.push(current);

current = "";

continue;

}

current += char;

}

result.push(current);

return result;

}

result.season === item.season &&

result.title === item.title

);

result.season === item.season &&

result.title === item.title

);

}
