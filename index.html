<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>쇼트트랙 대회 일정</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f8;
}

header{
background:#003b78;
color:white;
text-align:center;
padding:28px;
font-size:30px;
font-weight:bold;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.search{
width:100%;
padding:14px;
border:none;
border-radius:10px;
font-size:16px;
margin-bottom:20px;
}

.tabs{
display:flex;
gap:10px;
margin-bottom:20px;
}

.tab{
flex:1;
padding:14px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
background:white;
}

.tab.active{
background:#003b78;
color:white;
}

.card{
background:white;
border-radius:12px;
padding:18px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
cursor:pointer;
}

.date{
color:#777;
font-size:14px;
margin-bottom:8px;
}

.title{
font-size:22px;
font-weight:bold;
margin-bottom:8px;
}

.place{
color:#0066cc;
}

.detail{
display:none;
margin-top:15px;
border-top:1px solid #ddd;
padding-top:15px;
line-height:1.8;
}

.calendar-nav{
display:flex;
justify-content:center;
align-items:center;
gap:15px;
margin-bottom:20px;
}

.calendar-nav button{
padding:8px 15px;
border:none;
background:#003b78;
color:white;
border-radius:8px;
cursor:pointer;
}

.calendar-grid{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:2px;
background:#ddd;
}

.day-header{
background:#003b78;
color:white;
padding:10px;
text-align:center;
font-weight:bold;
}

.day{
background:white;
min-height:100px;
padding:5px;
}

.day-number{
font-weight:bold;
margin-bottom:5px;
}

.event{
background:#e8f1ff;
font-size:11px;
padding:2px 4px;
margin-top:2px;
border-radius:4px;
}

.hidden{
display:none;
}

@media(max-width:768px){

header{
font-size:24px;
}

.title{
font-size:18px;
}

.day{
min-height:80px;
}

.event{
font-size:10px;
}
}
</style>
</head>
<body>

<header>
쇼트트랙 대회 일정
</header>

<div class="container">

<input
type="text"
id="search"
class="search"
placeholder="대회명 또는 장소 검색">

<div class="tabs">
<button class="tab active" onclick="showTab('schedule')">일정</button>
<button class="tab" onclick="showTab('calendar')">달력</button>
<button class="tab" onclick="showTab('past')">종료대회</button>
</div>

<div id="scheduleTab"></div>

<div id="calendarTab" class="hidden">

<div class="calendar-nav">
<button id="prevMonth">◀</button>
<h2 id="calendarTitle"></h2>
<button id="nextMonth">▶</button>
</div>

<div id="calendarContainer"></div>

</div>

<div id="pastTab" class="hidden"></div>

</div>

<script>

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTRV-lLroEFMXiMaricD-GkYcWOyt8cwT6Z6f49GlqbJVwXMQdJllhzPc_gg8io9x6B-z0o_tk3Xbdl/pub?output=csv";

let competitions = [];

function parseDate(str){

if(!str || str==="미정"){
return null;
}

const p = str.split(".");
return new Date(
Number(p[0]),
Number(p[1])-1,
Number(p[2])
);

}

function formatRange(start,end){

if(!end || start===end){
return start;
}

return start+" ~ "+end;
}

function toggleDetail(el){

const detail=el.querySelector(".detail");

if(detail.style.display==="block"){
detail.style.display="none";
}else{
detail.style.display="block";
}
}

function createCard(item){

return `
<div class="card" onclick="toggleDetail(this)">

<div class="date">
${formatRange(item.start,item.end)}
</div>

<div class="title">
${item.title}
</div>

<div class="place">
${item.place}
</div>

<div class="detail">

<p><b>구분:</b> ${item.type}</p>

<p><b>참가대상:</b> ${item.target}</p>

<p><b>분류:</b> ${item.category}</p>

<p><b>비고:</b> ${item.note}</p>

<p><b>경기결과:</b> ${item.result}</p>

</div>

</div>
`;
}

function renderSchedule(){

const schedule=document.getElementById("scheduleTab");
const past=document.getElementById("pastTab");

const keyword=
document.getElementById("search")
.value
.toLowerCase();

const today=new Date();

let upcoming="";
let finished="";

competitions.forEach(item=>{

const match=
item.title.toLowerCase().includes(keyword)
||
item.place.toLowerCase().includes(keyword);

if(!match)return;

const end=parseDate(item.end);

if(end && end<today){
finished+=createCard(item);
}else{
upcoming+=createCard(item);
}

});

schedule.innerHTML=upcoming;
past.innerHTML=finished;
}

function showTab(tab){

document
.querySelectorAll(".tab")
.forEach(t=>t.classList.remove("active"));

if(tab==="schedule"){
document.querySelectorAll(".tab")[0].classList.add("active");
}

if(tab==="calendar"){
document.querySelectorAll(".tab")[1].classList.add("active");
}

if(tab==="past"){
document.querySelectorAll(".tab")[2].classList.add("active");
}

document
.getElementById("scheduleTab")
.classList.add("hidden");

document
.getElementById("calendarTab")
.classList.add("hidden");

document
.getElementById("pastTab")
.classList.add("hidden");

if(tab==="schedule"){
document
.getElementById("scheduleTab")
.classList.remove("hidden");
}

if(tab==="calendar"){
document
.getElementById("calendarTab")
.classList.remove("hidden");
}

if(tab==="past"){
document
.getElementById("pastTab")
.classList.remove("hidden");
}

}

let currentDate=new Date();

function renderCalendar(){

const year=currentDate.getFullYear();
const month=currentDate.getMonth();

document.getElementById("calendarTitle")
.textContent=
`${year}년 ${month+1}월`;

const firstDay=
new Date(year,month,1);

const lastDay=
new Date(year,month+1,0);

let html=`
<div class="calendar-grid">
`;

["일","월","화","수","목","금","토"]
.forEach(d=>{
html+=`<div class="day-header">${d}</div>`;
});

for(let i=0;i<firstDay.getDay();i++){
html+=`<div class="day"></div>`;
}

for(let day=1;day<=lastDay.getDate();day++){

html+=`
<div class="day">
<div class="day-number">${day}</div>
`;

competitions.forEach(item=>{

const start=parseDate(item.start);
const end=parseDate(item.end);

if(!start || !end)return;

const current=
new Date(year,month,day);

if(current>=start && current<=end){

html+=`
<div class="event">
${item.title}
</div>
`;

}

});

html+=`</div>`;
}

html+=`</div>`;

document.getElementById("calendarContainer")
.innerHTML=html;
}

async function loadData(){

const response=await fetch(CSV_URL);

const text=await response.text();

const rows=text.trim().split("\n");

rows.shift();

competitions=[];

rows.forEach(row=>{

const c=row.split(",");

competitions.push({

start:c[0]||"",
end:c[1]||"",
title:c[2]||"",
place:c[3]||"",
type:c[4]||"",
target:c[5]||"",
category:c[6]||"",
note:c[7]||"",
result:c[8]||""

});

});

renderSchedule();
renderCalendar();

}

document
.getElementById("search")
.addEventListener("input",renderSchedule);

document
.getElementById("prevMonth")
.addEventListener("click",()=>{

currentDate.setMonth(
currentDate.getMonth()-1
);

renderCalendar();

});

document
.getElementById("nextMonth")
.addEventListener("click",()=>{

currentDate.setMonth(
currentDate.getMonth()+1
);

renderCalendar();

});

loadData();

</script>

</body>
</html>
