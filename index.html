<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>쇼트트랙 대회 일정</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f8;
color:#222;
}

header{
background:#003b78;
color:white;
padding:24px;
text-align:center;
font-size:30px;
font-weight:bold;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.search{
width:100%;
padding:14px;
border:none;
border-radius:12px;
font-size:16px;
margin-bottom:20px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.tabs{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-bottom:20px;
}

.tab{
flex:1;
min-width:140px;
padding:14px;
border:none;
border-radius:10px;
background:white;
cursor:pointer;
font-weight:bold;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.tab.active{
background:#003b78;
color:white;
}

.card{
background:white;
padding:18px;
border-radius:12px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
cursor:pointer;
transition:.2s;
}

.card:hover{
transform:translateY(-2px);
}

.date{
font-size:14px;
color:#666;
margin-bottom:8px;
}

.title{
font-size:22px;
font-weight:bold;
margin-bottom:8px;
}

.place{
color:#0066cc;
}

.badge{
display:inline-block;
padding:4px 10px;
border-radius:999px;
font-size:12px;
margin-top:10px;
}

.badge-upcoming{
background:#dbeafe;
}

.badge-live{
background:#dcfce7;
}

.badge-finished{
background:#e5e7eb;
}

.hidden{
display:none;
}

/* 달력 */

.calendar-nav{
display:flex;
justify-content:center;
align-items:center;
gap:15px;
margin-bottom:20px;
}

.calendar-nav button{
padding:8px 15px;
border:none;
border-radius:8px;
background:#003b78;
color:white;
cursor:pointer;
}

.calendar-grid{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:2px;
background:#ddd;
}

.day-header{
background:#003b78;
color:white;
text-align:center;
padding:10px;
font-weight:bold;
}

.day{
background:white;
min-height:110px;
padding:5px;
}

.day-number{
font-weight:bold;
margin-bottom:5px;
}

.event{
background:#e8f1ff;
border-radius:5px;
padding:4px;
margin-top:4px;
font-size:11px;
cursor:pointer;
}

.event:hover{
background:#d6e8ff;
}

/* 모달 */

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.55);
justify-content:center;
align-items:center;
z-index:999;
padding:20px;
}

.modal-content{
background:white;
width:100%;
max-width:700px;
border-radius:14px;
padding:25px;
max-height:85vh;
overflow:auto;
}

.modal-title{
font-size:24px;
font-weight:bold;
margin-bottom:15px;
}

.info-row{
margin-bottom:12px;
line-height:1.7;
}

.close-btn{
float:right;
border:none;
background:#003b78;
color:white;
padding:8px 14px;
border-radius:8px;
cursor:pointer;
}

/* 모바일 */

@media(max-width:768px){

header{
font-size:24px;
}

.title{
font-size:18px;
}

.day{
min-height:80px;
}

.event{
font-size:10px;
}

.tab{
min-width:100%;
}

}

</style>
</head>

<body>

<header>
쇼트트랙 대회 일정
</header>

<div class="container">

<input
type="text"
id="search"
class="search"
placeholder="대회명 또는 장소 검색">

<div class="tabs">

<button class="tab active"
onclick="showTab('schedule')">
전체 일정
</button>

<button class="tab"
onclick="showTab('month')">
이번달 경기
</button>

<button class="tab"
onclick="showTab('domestic')">
국내 대회
</button>

<button class="tab"
onclick="showTab('international')">
국제 대회
</button>

<button class="tab"
onclick="showTab('calendar')">
달력
</button>

<button class="tab"
onclick="showTab('past')">
종료 대회
</button>

</div>

<div id="scheduleTab"></div>

<div id="monthTab" class="hidden"></div>

<div id="domesticTab" class="hidden"></div>

<div id="internationalTab" class="hidden"></div>

<div id="calendarTab" class="hidden">

<div class="calendar-nav">

<button id="prevMonth">
◀
</button>

<h2 id="calendarTitle"></h2>

<button id="nextMonth">
▶
</button>

</div>

<div id="calendarContainer"></div>

</div>

<div id="pastTab" class="hidden"></div>

</div>

<div id="detailModal" class="modal">

<div class="modal-content">

<button
class="close-btn"
onclick="closeModal()">
닫기
</button>

<div id="modalBody"></div>

</div>

</div>
<script>

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTRV-lLroEFMXiMaricD-GkYcWOyt8cwT6Z6f49GlqbJVwXMQdJllhzPc_gg8io9x6B-z0o_tk3Xbdl/pub?output=csv";

let competitions = [];
let currentDate = new Date();

function parseDate(str){

if(!str) return null;

const p = str.trim().split(".");

if(p.length !== 3) return null;

return new Date(
Number(p[0]),
Number(p[1])-1,
Number(p[2])
);

}

function formatRange(start,end){

if(!end || start===end){
return start;
}

return `${start} ~ ${end}`;

}

function getStatus(item){

const today = new Date();

today.setHours(0,0,0,0);

const start = parseDate(item.start);
const end = parseDate(item.end);

if(!start || !end){
return "upcoming";
}

if(end < today){
return "finished";
}

if(start <= today && end >= today){
return "live";
}

return "upcoming";

}

function getBadge(item){

const status = getStatus(item);

if(status==="live"){
return '<span class="badge badge-live">진행중</span>';
}

if(status==="finished"){
return '<span class="badge badge-finished">종료</span>';
}

return '<span class="badge badge-upcoming">예정</span>';

}

function openModal(index){

const item = competitions[index];

document.getElementById("modalBody").innerHTML = `

<div class="modal-title">
${item.title}
</div>

<div class="info-row">
📅 <b>기간</b><br>
${formatRange(item.start,item.end)}
</div>

<div class="info-row">
📍 <b>장소</b><br>
${item.place || "-"}
</div>

<div class="info-row">
🏷️ <b>구분</b><br>
${item.type || "-"}
</div>

<div class="info-row">
👥 <b>참가대상</b><br>
${item.target || "-"}
</div>

<div class="info-row">
📂 <b>분류</b><br>
${item.category || "-"}
</div>

<div class="info-row">
📝 <b>비고</b><br>
${item.note || "-"}
</div>

<div class="info-row">
🏆 <b>경기결과</b><br>
${item.result || "등록 전"}
</div>

`;

document.getElementById("detailModal")
.style.display = "flex";

}

function closeModal(){

document.getElementById("detailModal")
.style.display = "none";

}

window.addEventListener("click",(e)=>{

const modal =
document.getElementById("detailModal");

if(e.target === modal){
closeModal();
}

});

function createCard(item,index){

return `

<div
class="card"
onclick="openModal(${index})">

<div class="date">
${formatRange(item.start,item.end)}
</div>

<div class="title">
${item.title}
</div>

<div class="place">
${item.place}
</div>

${getBadge(item)}

</div>

`;

}

function renderTabs(){

const schedule =
document.getElementById("scheduleTab");

const month =
document.getElementById("monthTab");

const domestic =
document.getElementById("domesticTab");

const international =
document.getElementById("internationalTab");

const past =
document.getElementById("pastTab");

const keyword =
document.getElementById("search")
.value
.toLowerCase();

const today = new Date();

let allHtml = "";
let monthHtml = "";
let domesticHtml = "";
let internationalHtml = "";
let pastHtml = "";

competitions.forEach((item,index)=>{

const title =
(item.title || "")
.toLowerCase();

const place =
(item.place || "")
.toLowerCase();

if(
!title.includes(keyword) &&
!place.includes(keyword)
){
return;
}

const start =
parseDate(item.start);

const end =
parseDate(item.end);

const card =
createCard(item,index);

if(end && end < today){

pastHtml += card;
return;

}

allHtml += card;

if(item.type === "국내"){
domesticHtml += card;
}

if(item.type === "국제"){
internationalHtml += card;
}

if(start){

if(
start.getMonth() === today.getMonth() &&
start.getFullYear() === today.getFullYear()
){
monthHtml += card;
}

}

});

schedule.innerHTML = allHtml;
month.innerHTML = monthHtml;
domestic.innerHTML = domesticHtml;
international.innerHTML = internationalHtml;
past.innerHTML = pastHtml;

}

function showTab(tab){

document
.querySelectorAll(".tab")
.forEach(btn=>{
btn.classList.remove("active");
});

const map = {
schedule:0,
month:1,
domestic:2,
international:3,
calendar:4,
past:5
};

document
.querySelectorAll(".tab")
[map[tab]]
.classList.add("active");

[
"scheduleTab",
"monthTab",
"domesticTab",
"internationalTab",
"calendarTab",
"pastTab"
].forEach(id=>{

document
.getElementById(id)
.classList.add("hidden");

});

document
.getElementById(tab+"Tab")
.classList.remove("hidden");

}

document
.getElementById("search")
.addEventListener(
"input",
renderTabs
);
  function renderCalendar(){

const year =
currentDate.getFullYear();

const month =
currentDate.getMonth();

document
.getElementById("calendarTitle")
.textContent =
`${year}년 ${month+1}월`;

const firstDay =
new Date(year,month,1);

const lastDay =
new Date(year,month+1,0);

let html = `
<div class="calendar-grid">
`;

["일","월","화","수","목","금","토"]
.forEach(day=>{

html += `
<div class="day-header">
${day}
</div>
`;

});

for(
let i=0;
i<firstDay.getDay();
i++
){

html += `
<div class="day"></div>
`;

}

for(
let day=1;
day<=lastDay.getDate();
day++
){

html += `
<div class="day">

<div class="day-number">
${day}
</div>
`;

competitions.forEach((item,index)=>{

const start =
parseDate(item.start);

const end =
parseDate(item.end);

if(
!start ||
!end
){
return;
}

const current =
new Date(
year,
month,
day
);

if(
current >= start &&
current <= end
){

html += `
<div
class="event"
onclick="openModal(${index})">

${item.title}

</div>
`;

}

});

html += `
</div>
`;

}

html += `
</div>
`;

document
.getElementById("calendarContainer")
.innerHTML = html;

}

function parseCSVLine(line){

const result = [];

let current = "";

let insideQuotes = false;

for(
let i=0;
i<line.length;
i++
){

const char = line[i];

if(char === '"'){

insideQuotes =
!insideQuotes;

continue;

}

if(
char === "," &&
!insideQuotes
){

result.push(current);
current = "";
continue;

}

current += char;

}

result.push(current);

return result;

}

async function loadData(){

try{

const response =
await fetch(CSV_URL);

const text =
await response.text();

const rows =
text
.trim()
.split("\n");

rows.shift();

competitions = [];

rows.forEach(row=>{

const c =
parseCSVLine(row);

competitions.push({

start: c[0] || "",
end: c[1] || "",
title: c[2] || "",
place: c[3] || "",
type: c[4] || "",
target: c[5] || "",
category: c[6] || "",
note: c[7] || "",
result: c[8] || ""

});

});

competitions.sort((a,b)=>{

const da =
parseDate(a.start);

const db =
parseDate(b.start);

if(!da || !db){
return 0;
}

return da-db;

});

renderTabs();
renderCalendar();

}catch(error){

console.error(error);

document
.getElementById("scheduleTab")
.innerHTML = `
<h3>
데이터를 불러오지 못했습니다.
</h3>
`;

}

}
  document
.getElementById("prevMonth")
.addEventListener("click",()=>{

currentDate.setMonth(
currentDate.getMonth()-1
);

renderCalendar();

});

document
.getElementById("nextMonth")
.addEventListener("click",()=>{

currentDate.setMonth(
currentDate.getMonth()+1
);

renderCalendar();

});

loadData();

</script>

</body>
</html>
