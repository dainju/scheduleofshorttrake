.modal-content{

<script>

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTRV-lLroEFMXiMaricD-GkYcWOyt8cwT6Z6f49GlqbJVwXMQdJllhzPc_gg8io9x6B-z0o_tk3Xbdl/pub?output=csv";

const PLAYER_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTyGAUBesyUjGuuAHSsJB0pVgTzPsW_D6H0i1U8mdflyI4zFPzmlwWYrMuXBIjSblX0c-7mVoFX3AW7/pub?output=csv";

let competitions = [];

let players = [];

let currentDate =
new Date();

let currentPlayerGroup =
"male";
  /* 날짜 변환 */

function parseDate(str){

if(!str) return null;

const p =
str.trim().split(".");

if(p.length!==3)
return null;

return new Date(
Number(p[0]),
Number(p[1])-1,
Number(p[2])
);

}

/* 날짜 범위 */

function formatRange(start,end){

if(
!end ||
start===end
){
return start;
}

return `${start} ~ ${end}`;

}

/* DDAY */

function getDday(item){

const start =
parseDate(item.start);

if(!start)
return "";

const today =
new Date();

today.setHours(
0,0,0,0
);

const diff =
Math.ceil(
(start-today)
/(1000*60*60*24)
);

if(diff>0){

return `D-${diff}`;

}

return "";

}

/* 상세 팝업 */

function openModal(index){

const item =
competitions[index];

document
.getElementById("modalBody")
.innerHTML = `

<div class="modal-title">
${item.title}
</div>

<div class="info-row">
<b>기간</b><br>
${formatRange(
item.start,
item.end
)}
</div>

<div class="info-row">
<b>장소</b><br>
${item.place||"-"}
</div>

<div class="info-row">
<b>구분</b><br>
${item.type||"-"}
</div>

<div class="info-row">
<b>참가대상</b><br>
${item.target||"-"}
</div>

<div class="info-row">
<b>분류</b><br>
${item.category||"-"}
</div>

<div class="info-row">
<b>비고</b><br>
${item.note||"-"}
</div>

<div class="info-row">
<b>경기결과</b><br>
${item.result||"등록 전"}
</div>

`;

document
.getElementById("detailModal")
.style.display =
"flex";

}

function closeModal(){

document
.getElementById("detailModal")
.style.display =
"none";

}

/* 바깥 클릭 */

window.addEventListener(
"click",
(e)=>{

const modal =
document.getElementById(
"detailModal"
);

if(
e.target===modal
){
closeModal();
}

}
);

/* 카드 생성 */

function createCard(item,index){

return `

<div
class="card"
onclick="openModal(${index})">

<div class="card-top">

<div>

${formatRange(
item.start,
item.end
)}

</div>

<div class="dday">

${getDday(item)}

</div>

</div>

<div class="title">

${item.title}

</div>

<div class="place">

${item.place}

</div>

</div>

`;

}

/* 햄버거 */

function toggleMenu(){

document
.getElementById("sidebar")
.classList
.toggle("open");

}

function selectMenu(tab){

showTab(tab);

document
.getElementById("sidebar")
.classList
.remove("open");

}

/* 탭 전환 */

function showTab(tab){

[
"scheduleTab",
"monthTab",
"domesticTab",
"internationalTab",
"calendarTab",
"pastTab",
"playerTab"
].forEach(id=>{

document
.getElementById(id)
.classList
.add("hidden");

});

document
.getElementById(
tab+"Tab"
)
.classList
.remove("hidden");

}
  /* 일정 렌더링 */

function renderTabs(){

const schedule =
document.getElementById(
"scheduleTab"
);

const month =
document.getElementById(
"monthTab"
);

const domestic =
document.getElementById(
"domesticTab"
);

const international =
document.getElementById(
"internationalTab"
);

const past =
document.getElementById(
"pastTab"
);

const keyword =
document
.getElementById("search")
.value
.toLowerCase();

const today =
new Date();

today.setHours(
0,0,0,0
);

let allHtml = "";
let monthHtml = "";
let domesticHtml = "";
let internationalHtml = "";
let pastHtml = "";

competitions.forEach(
(item,index)=>{

const title =
(item.title||"")
.toLowerCase();

const place =
(item.place||"")
.toLowerCase();

if(
!title.includes(keyword)
&&
!place.includes(keyword)
){
return;
}

const start =
parseDate(item.start);

const end =
parseDate(item.end);

const card =
createCard(
item,
index
);

if(
end &&
end < today
){

pastHtml += card;

return;

}

/* 전체 */

allHtml += card;

/* 국내 */

if(
item.type==="국내"
){

domesticHtml += card;

}

/* 국제 */

if(
item.type==="국제"
){

internationalHtml += card;

}

/* 이번달 */

if(start){

if(

start.getMonth()
===
today.getMonth()

&&

start.getFullYear()
===
today.getFullYear()

){

monthHtml += card;

}

}

});

schedule.innerHTML =
allHtml;

month.innerHTML =
monthHtml;

domestic.innerHTML =
domesticHtml;

international.innerHTML =
internationalHtml;

past.innerHTML =
pastHtml;

}

/* 일정 검색 */

document
.getElementById("search")
.addEventListener(
"input",
renderTabs
);
  /* =========================
   선수 데이터
========================= */

function showPlayerGroup(group){

currentPlayerGroup =
group;

showTab("player");

renderPlayers();

document
.getElementById("sidebar")
.classList
.remove("open");

}

function renderPlayers(){

const wrap =
document.getElementById(
"playerContent"
);

const keyword =
(
document
.getElementById(
"playerSearch"
)
?.value || ""
)
.toLowerCase();

let html = "";

if(
currentPlayerGroup ===
"male"
){

html += `
<div class="section-title">
남자 국가대표
</div>
`;

players
.filter(p=>p.group==="male")
.forEach(player=>{

if(

return;
}

html += `

<div class="player-card">

<div class="player-name">
${player.name}
</div>

<div class="player-team">
${player.team}
</div>

</div>

`;

});

}

else if(
currentPlayerGroup ===
"female"
){

html += `
<div class="section-title">
여자 국가대표
</div>
`;

players
.filter(p=>p.group==="female")
.forEach(player=>{

if(
keyword &&
!player.name
.toLowerCase()
.includes(keyword)
){
return;
}

html += `

<div class="player-card">

<div class="player-name">
${player.name}
</div>

<div class="player-team">
${player.team}
</div>

</div>

`;

});

}

else if(
currentPlayerGroup ===
"team"
){

html += `
<div class="section-title">
실업팀
</div>
`;

const teams =
[
"강원도청",
"고양시청",
"서울시청",
"성남시청",
"스포츠토토",
"전북도청",
"화성시청"
];

teams.forEach(team=>{

html += `
<h3 style="margin:20px 0 10px;">
${team}
</h3>
`;

players
.filter(
p=>p.team===team
)
.forEach(player=>{

if(
keyword &&
!player.name
.toLowerCase()
.includes(keyword)
){
return;
}

html += `

<div class="player-card">

<div class="player-name">
${player.name}
</div>

</div>

`;

});

});

}

else if(
currentPlayerGroup ===
"university"
){

html += `
<div class="section-title">
대학부
</div>
`;

const universities =
[
"경희대",
"고려대",
"국민대",
"단국대",
"서울시립대",
"용인대",
"한국체대",
"한양대"
];

universities.forEach(univ=>{

html += `
<h3 style="margin:20px 0 10px;">
${univ}
</h3>
`;

players
.filter(
p=>p.team===univ
)
.forEach(player=>{

if(
keyword &&
!player.name
.toLowerCase()
.includes(keyword)
){
return;
}

html += `

<div class="player-card">

<div class="player-name">
${player.name}
</div>

</div>

`;

});

});

}

wrap.innerHTML = html;

}
  /* =========================
   선수 CSV 로드
========================= */

async function loadPlayers(){

try{

const response =
await fetch(
PLAYER_URL
);

const text =
await response.text();

const rows =
text.trim().split("\n");

players = [];

rows.forEach((row,rowIndex)=>{

if(rowIndex===0)
return;

const cols =
parseCSVLine(row);

/* A 남국대 */

if(cols[0]){

players.push({

name: cols[0].trim(),

team:
cols[2] ||
"국가대표",

group:
"male"

});

}

/* B 여국대 */

if(cols[1]){

players.push({

name: cols[1].trim(),

team:
cols[3] ||
"국가대표",

group:
"female"

});

}

/* C~I 실업팀 */

const teamNames = [

"강원도청",
"고양시청",
"서울시청",
"성남시청",
"스포츠토토",
"전북도청",
"화성시청"

];

for(
let i=2;
i<=8;
i++
){

if(cols[i]){

players.push({

name:
cols[i].trim(),

team:
teamNames[i-2],

group:
"team"

});

}

}

/* J~Q 대학부 */

const universityNames = [

"경희대",
"고려대",
"국민대",
"단국대",
"서울시립대",
"용인대",
"한국체대",
"한양대"

];

for(
let i=9;
i<=16;
i++
){

if(cols[i]){

players.push({

name:
cols[i].trim(),

team:
universityNames[i-9],

group:
"university"

});

}

}

});

renderPlayers();

}catch(error){

console.error(
"선수 데이터 로드 실패",
error
);

}

}

/* 선수 검색 */

document
.getElementById(
"playerSearch"
)
.addEventListener(
"input",
renderPlayers
);
  /* =========================
   달력
========================= */

function renderCalendar(){

const year =
currentDate.getFullYear();

const month =
currentDate.getMonth();

document
.getElementById(
"calendarTitle"
)
.textContent =
`${year}년 ${month+1}월`;

const firstDay =
new Date(
year,
month,
1
);

const lastDay =
new Date(
year,
month+1,
0
);

let html = `
<div class="calendar-grid">
`;

[
"일",
"월",
"화",
"수",
"목",
"금",
"토"
].forEach(day=>{

html += `
<div class="day-header">
${day}
</div>
`;

});

for(
let i=0;
i<firstDay.getDay();
i++
){

html += `
<div class="day"></div>
`;

}

for(
let day=1;
day<=lastDay.getDate();
day++
){

html += `
<div class="day">

<div class="day-number">
${day}
</div>
`;

competitions.forEach(
(item,index)=>{

const start =
parseDate(item.start);

const end =
parseDate(item.end);

if(
!start ||
!end
){
return;
}

const current =
new Date(
year,
month,
day
);

if(
current >= start &&
current <= end
){

html += `

<div
class="event"
onclick="openModal(${index})">

${item.title}

</div>

`;

}

});

html += `
</div>
`;

}

html += `
</div>
`;

document
.getElementById(
"calendarContainer"
)
.innerHTML =
html;

}

/* 이전 달 */

document
.getElementById(
"prevMonth"
)
.addEventListener(
"click",
()=>{

currentDate.setMonth(
currentDate.getMonth()-1
);

renderCalendar();

}
);

/* 다음 달 */

document
.getElementById(
"nextMonth"
)
.addEventListener(
"click",
()=>{

currentDate.setMonth(
currentDate.getMonth()+1
);

renderCalendar();

}
);
/* =========================
   CSV 파서
========================= */

function parseCSVLine(line){

const result = [];

let current = "";

let insideQuotes = false;

for(
let i=0;
i<line.length;
i++
){

const char = line[i];

if(char === '"'){

insideQuotes =
!insideQuotes;

continue;

}

if(
char === "," &&
!insideQuotes
){

result.push(current);

current = "";

continue;

}

current += char;

}

result.push(current);

return result;

}

/* =========================
   대회 데이터 로드
========================= */

async function loadData(){

try{

const response =
await fetch(
CSV_URL
);

const text =
await response.text();

const rows =
text
.trim()
.split("\n");

rows.shift();

competitions = [];

rows.forEach(row=>{

const c =
parseCSVLine(row);

competitions.push({

start:
c[0] || "",

end:
c[1] || "",

title:
c[2] || "",

place:
c[3] || "",

type:
c[4] || "",

target:
c[5] || "",

category:
c[6] || "",

note:
c[7] || "",

result:
c[8] || ""

});

});

/* 날짜순 정렬 */

competitions.sort(
(a,b)=>{

const da =
parseDate(a.start);

const db =
parseDate(b.start);

if(
!da ||
!db
){
return 0;
}

return da-db;
