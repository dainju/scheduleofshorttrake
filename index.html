<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>쇼트트랙 대회 일정</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f8;
color:#222;
}

header{
background:#003b78;
color:white;
padding:25px;
text-align:center;
font-size:30px;
font-weight:bold;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.search{
width:100%;
padding:14px;
border:none;
border-radius:10px;
font-size:16px;
margin-bottom:20px;
box-shadow:0 2px 6px rgba(0,0,0,.08);
}

.tabs{
display:flex;
gap:10px;
margin-bottom:20px;
}

.tab{
flex:1;
padding:14px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
background:white;
box-shadow:0 2px 6px rgba(0,0,0,.08);
}

.tab.active{
background:#003b78;
color:white;
}

.card{
background:white;
border-radius:12px;
padding:18px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
cursor:pointer;
transition:.2s;
}

.card:hover{
transform:translateY(-2px);
}

.date{
font-size:14px;
color:#777;
margin-bottom:8px;
}

.title{
font-size:22px;
font-weight:bold;
margin-bottom:8px;
}

.place{
color:#0066cc;
}

.hidden{
display:none;
}

.calendar-nav{
display:flex;
justify-content:center;
align-items:center;
gap:15px;
margin-bottom:20px;
}

.calendar-nav button{
padding:8px 15px;
border:none;
background:#003b78;
color:white;
border-radius:8px;
cursor:pointer;
}

.calendar-grid{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:2px;
background:#ddd;
}

.day-header{
background:#003b78;
color:white;
padding:10px;
text-align:center;
font-weight:bold;
}

.day{
background:white;
min-height:110px;
padding:6px;
}

.day-number{
font-weight:bold;
margin-bottom:5px;
}

.event{
background:#e7f1ff;
padding:4px;
margin-top:4px;
border-radius:6px;
font-size:11px;
cursor:pointer;
}

.event:hover{
background:#d3e7ff;
}

.badge{
display:inline-block;
padding:4px 8px;
border-radius:999px;
font-size:12px;
margin-top:8px;
}

.live{
background:#d4f8d4;
}

.upcoming{
background:#dbeafe;
}

.finished{
background:#e5e7eb;
}

/* 모달 */

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.6);
z-index:999;
justify-content:center;
align-items:center;
padding:20px;
}

.modal-content{
background:white;
max-width:700px;
width:100%;
border-radius:14px;
padding:25px;
max-height:80vh;
overflow:auto;
}

.modal-title{
font-size:24px;
font-weight:bold;
margin-bottom:15px;
}

.close-btn{
float:right;
border:none;
background:#003b78;
color:white;
padding:8px 14px;
border-radius:8px;
cursor:pointer;
}

.info-row{
margin-bottom:12px;
line-height:1.6;
}

@media(max-width:768px){

header{
font-size:24px;
}

.tabs{
flex-direction:column;
}

.title{
font-size:18px;
}

.day{
min-height:80px;
}

.event{
font-size:10px;
}

.modal-content{
padding:18px;
}

}

</style>
</head>

<body>

<header>
쇼트트랙 대회 일정
</header>

<div class="container">

<input
type="text"
id="search"
class="search"
placeholder="대회명 또는 장소 검색">

<div class="tabs">

<button
class="tab active"
onclick="showTab('schedule')">
일정
</button>

<button
class="tab"
onclick="showTab('calendar')">
달력
</button>

<button
class="tab"
onclick="showTab('past')">
종료대회
</button>

</div>

<div id="scheduleTab"></div>

<div id="calendarTab" class="hidden">

<div class="calendar-nav">

<button id="prevMonth">
◀
</button>

<h2 id="calendarTitle">
</h2>

<button id="nextMonth">
▶
</button>

</div>

<div id="calendarContainer"></div>

</div>

<div id="pastTab" class="hidden"></div>

</div>

<div id="detailModal" class="modal">

<div class="modal-content">

<button
class="close-btn"
onclick="closeModal()">
닫기
</button>

<div id="modalBody"></div>

</div>

</div>
<script>

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTRV-lLroEFMXiMaricD-GkYcWOyt8cwT6Z6f49GlqbJVwXMQdJllhzPc_gg8io9x6B-z0o_tk3Xbdl/pub?output=csv";

let competitions = [];
let currentDate = new Date();

function parseDate(str){

if(!str) return null;

const p = str.trim().split(".");

return new Date(
Number(p[0]),
Number(p[1])-1,
Number(p[2])
);

}

function formatRange(start,end){

if(!end || start===end){
return start;
}

const s = start.split(".");
const e = end.split(".");

if(
s[0]===e[0] &&
s[1]===e[1]
){
return `${start}-${e[2]}`;
}

return `${start} ~ ${end}`;
}

function getStatus(item){

const today = new Date();

today.setHours(0,0,0,0);

const start = parseDate(item.start);
const end = parseDate(item.end);

if(end < today){
return "finished";
}

if(start <= today && end >= today){
return "live";
}

return "upcoming";

}

function getBadge(item){

const status = getStatus(item);

if(status==="live"){
return '<span class="badge live">진행중</span>';
}

if(status==="finished"){
return '<span class="badge finished">종료</span>';
}

return '<span class="badge upcoming">예정</span>';

}

function openModal(index){

const item = competitions[index];

document.getElementById("modalBody").innerHTML = `

<div class="modal-title">
${item.title}
</div>

<div class="info-row">
📅 ${formatRange(item.start,item.end)}
</div>

<div class="info-row">
📍 ${item.place}
</div>

<div class="info-row">
<b>구분</b><br>
${item.type || "-"}
</div>

<div class="info-row">
<b>참가대상</b><br>
${item.target || "-"}
</div>

<div class="info-row">
<b>분류</b><br>
${item.category || "-"}
</div>

<div class="info-row">
<b>비고</b><br>
${item.note || "-"}
</div>

<div class="info-row">
<b>경기결과</b><br>
${item.result || "등록 전"}
</div>

`;

document.getElementById("detailModal")
.style.display="flex";

}

function closeModal(){

document.getElementById("detailModal")
.style.display="none";

}

window.onclick=function(e){

const modal =
document.getElementById("detailModal");

if(e.target===modal){
closeModal();
}

}

function createCard(item,index){

return `

<div
class="card"
onclick="openModal(${index})">

<div class="date">
${formatRange(item.start,item.end)}
</div>

<div class="title">
${item.title}
</div>

<div class="place">
${item.place}
</div>

${getBadge(item)}

</div>

`;

}

function renderSchedule(){

const keyword =
document
.getElementById("search")
.value
.toLowerCase();

const today = new Date();

let upcoming = "";
let finished = "";

competitions.forEach((item,index)=>{

const match =

item.title.toLowerCase().includes(keyword)

||

item.place.toLowerCase().includes(keyword);

if(!match){
return;
}

const end = parseDate(item.end);

if(end < today){

finished += createCard(item,index);

}else{

upcoming += createCard(item,index);

}

});

document
.getElementById("scheduleTab")
.innerHTML = upcoming;

document
.getElementById("pastTab")
.innerHTML = finished;

}

function showTab(tab){

document
.querySelectorAll(".tab")
.forEach(btn=>btn.classList.remove("active"));

document
.querySelectorAll(".tab")
.forEach(btn=>{

if(btn.innerText==="일정" && tab==="schedule"){
btn.classList.add("active");
}

if(btn.innerText==="달력" && tab==="calendar"){
btn.classList.add("active");
}

if(btn.innerText==="종료대회" && tab==="past"){
btn.classList.add("active");
}

});

document
.getElementById("scheduleTab")
.classList.add("hidden");

document
.getElementById("calendarTab")
.classList.add("hidden");

document
.getElementById("pastTab")
.classList.add("hidden");

if(tab==="schedule"){
document
.getElementById("scheduleTab")
.classList.remove("hidden");
}

if(tab==="calendar"){
document
.getElementById("calendarTab")
.classList.remove("hidden");
}

if(tab==="past"){
document
.getElementById("pastTab")
.classList.remove("hidden");
}

}

document
.getElementById("search")
.addEventListener(
"input",
renderSchedule
);
