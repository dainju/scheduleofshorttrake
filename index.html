<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Shortchedule</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>

<button
class="menu-btn"
onclick="toggleMenu()">

☰

</button>

<div class="header-title">
Shortchedule
</div>

</header>


<div
id="overlay"
class="overlay"
onclick="closeMenu()">
</div>


<div
id="sidebar"
class="sidebar">

<div class="menu-item"
onclick="showScreen('scheduleScreen')">
전체일정
</div>

<div class="menu-item"
onclick="showScreen('monthScreen')">
이번달 경기
</div>

<div class="menu-item"
onclick="showScreen('domesticScreen')">
국내대회
</div>

<div class="menu-item"
onclick="showScreen('internationalScreen')">
국제대회
</div>

<div class="menu-item"
onclick="showScreen('pastScreen')">
종료대회
</div>

<div class="menu-item"
onclick="showScreen('calendarScreen')">
달력
</div>

<div class="menu-item"
onclick="showScreen('playerScreen')">
선수
</div>

</div>


<div class="container">

<input
id="search"
class="search"
type="text"
placeholder="대회명 또는 장소 검색">


<div
id="scheduleScreen"
class="screen active">
</div>

<div
id="monthScreen"
class="screen">
</div>

<div
id="domesticScreen"
class="screen">
</div>

<div
id="internationalScreen"
class="screen">
</div>

<div
id="pastScreen"
class="screen">
</div>

<div
id="calendarScreen"
class="screen">
</div>

<div
id="playerScreen"
class="screen">
</div>

</div>


<div
id="detailModal"
class="modal">

<div class="modal-content">

<button
class="close-btn"
onclick="closeModal()">

닫기

</button>

<div id="modalBody"></div>

</div>

</div>


<script src="app.js"></script>

</body>
</html>
