/* =========================
   날짜 변환
========================= */

function parseDate(str){

if(!str)
return null;

const p =
str.trim().split(".");

if(
p.length !== 3
){
return null;
}

return new Date(
Number(p[0]),
Number(p[1])-1,
Number(p[2])
);

}

/* =========================
   날짜 범위 표시
========================= */

function formatRange(
start,
end
){

if(
!end ||
start===end
){

return start;

}

return `${start} ~ ${end}`;

}

/* =========================
   D-DAY
========================= */

function getDday(item){

const start =
parseDate(
item.start
);

if(!start)
return "";

const today =
new Date();

today.setHours(
0,0,0,0
);

const diff =
Math.ceil(
(start-today)
/
(1000*60*60*24)
);

if(diff > 0){

return `D-${diff}`;

}

if(diff === 0){

return "D-DAY";

}

return "";

}

   /* =========================

function showTab(tab){

"scheduleTab",

"domesticTab",
"internationalTab",
"calendarTab",
"pastTab"
].forEach(id=>{

.getElementById(id)

});

/* =========================
   일정 렌더링
========================= */

function renderTabs(){

const schedule =
document.getElementById(
"scheduleTab"
);

const month =
document.getElementById(
"monthTab"
);

const domestic =
document.getElementById(
"domesticTab"
);

const international =
document.getElementById(
"internationalTab"
);

const past =
document.getElementById(
"pastTab"
);

const keyword =
document
.getElementById(
"search"
)
.value
.toLowerCase();

const today =
new Date();

today.setHours(
0,0,0,0
);

let allHtml = "";
let monthHtml = "";
let domesticHtml = "";
let internationalHtml = "";
let pastHtml = "";

const sorted =

[...competitions]

.sort((a,b)=>{

const da =
parseDate(a.start);

const db =
parseDate(b.start);

if(
!da ||
!db
){
return 0;
}

return da-db;

});

sorted.forEach(item=>{

const title =
(item.title||"")
.toLowerCase();

const place =
(item.place||"")
.toLowerCase();

if(
keyword &&
!title.includes(keyword) &&
!place.includes(keyword)
){
return;
}

const start =
parseDate(item.start);

const end =
parseDate(item.end);

const card =
createCard(
item,
competitions.indexOf(item)
);

/* 종료 대회 */

if(
end &&
end < today
){

pastHtml += card;

return;

}

/* 전체 일정 */

allHtml += card;

/* 국내 대회 */

if(
item.type === "국내"
){

domesticHtml += card;

}

/* 국제 대회 */

if(
item.type === "국제"
){

internationalHtml += card;

}

/* 이번 달 경기 */

if(start){

if(
start.getMonth()
===
today.getMonth()
&&
start.getFullYear()
===
today.getFullYear()
){

monthHtml += card;

}

}

});

schedule.innerHTML =
allHtml ||
"<div class='card'>대회가 없습니다.</div>";

month.innerHTML =
monthHtml ||
"<div class='card'>이번 달 대회가 없습니다.</div>";

domestic.innerHTML =
domesticHtml ||
"<div class='card'>국내 대회가 없습니다.</div>";

international.innerHTML =
internationalHtml ||

past.innerHTML =
pastHtml ||
"<div class='card'>종료된 대회가 없습니다.</div>";

}

   /* =========================

function renderCalendar(){

const year =
currentDate.getFullYear();

const month =
currentDate.getMonth();

document
.getElementById(
"calendarTitle"
)
.textContent =
`${year}년 ${month+1}월`;

const firstDay =
new Date(
year,
month,
1
);

const lastDay =
new Date(
year,
month+1,
0
);

let html = `
<div class="calendar-grid">
`;

/* 요일 */

[
"일",
"월",
"화",
"수",
"목",
"금",
"토"
].forEach(day=>{

html += `
<div class="day-header">
${day}
</div>
`;

});

/* 앞 공백 */

for(
let i=0;
i<firstDay.getDay();
i++
){

html += `
<div class="day"></div>
`;

}

/* 날짜 */

for(
let day=1;
day<=lastDay.getDate();
day++
){

html += `

<div class="day">

<div class="day-number">
${day}
</div>

`;

competitions.forEach(
(item,index)=>{

const start =
parseDate(
item.start
);

const end =
parseDate(
item.end
);

if(
!start ||
!end
){
return;
}

const current =
new Date(
year,
month,
day
);

if(
current >= start &&
current <= end
){

html += `

<div
class="event"
onclick="openModal(${index})">

${item.title}

</div>

`;

}

});

html += `
</div>
`;

}

html += `
</div>
`;

document
.getElementById(
"calendarContainer"
)
.innerHTML =
html;

}

/* =========================

========================= */

"prevMonth"

currentDate.getMonth()-1

}
);

   /* =========================
   CSV 한 줄 파싱
========================= */

function parseCSVLine(line){

const result = [];

let current = "";

let insideQuotes = false;

for(
let i=0;
i<line.length;
i++
){

const char = line[i];

if(char === '"'){

insideQuotes =
!insideQuotes;

continue;

}

if(
char === "," &&
!insideQuotes
){

result.push(current);

current = "";

continue;

}

current += char;

}

result.push(current);

return result;

}

/* =========================
   대회 데이터 불러오기
========================= */

async function loadData(){

try{

const response =
await fetch(
CSV_URL
);

const text =
await response.text();

const rows =
text
.trim()
.split("\n");

/* 헤더 제거 */

rows.shift();

competitions = [];

rows.forEach(row=>{

const c =
parseCSVLine(row);

competitions.push({

start:
c[0] || "",

end:
c[1] || "",

title:
c[2] || "",

place:
c[3] || "",

type:
c[4] || "",

target:
c[5] || "",

category:
c[6] || "",

note:
c[7] || "",

result:
c[8] || ""

});

});

/* 시작일 기준 정렬 */

competitions.sort(
(a,b)=>{

const da =
parseDate(a.start);

const db =
parseDate(b.start);

if(
!da ||
!db
){
return 0;
}

return da-db;

}
);

/* 화면 렌더링 */

renderTabs();

renderCalendar();

}catch(error){

console.error(
"대회 데이터 로드 실패",
error
);

document
.getElementById(
"scheduleTab"
)
.innerHTML = `

<div class="card">

데이터를 불러오지 못했습니다.

</div>

`;

}

}

.push(c[6].trim());
